<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>拍摄策划工作台 v1.0.14</title>
<style>
/* ============================================================
   主题注册表 —— 新增主题只需往这里加一组 token 值
   ============================================================ */
:root{
  --r:10px; --r2:7px; --r3:5px;
  --ff:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  --fm:ui-monospace,"SF Mono",Consolas,monospace;
  --sh:0 1px 3px rgba(0,0,0,.06),0 8px 24px rgba(0,0,0,.06);
}
html[data-theme="light"]{
  --bg:#f4f6f8; --panel:#ffffff; --panel2:#f7f9fb; --border:#dde3ea;
  --text:#1a1d23; --text2:#5b6472; --text3:#939cab;
  --accent:#2f6fa8; --accent-bg:#e8f0f8;
  --green:#2e8b57; --amber:#b87514; --red:#c43d3d; --purple:#7d5ba6; --teal:#17827d;
  --req:#c43d3d; --ph:#eef1f5;
}
html[data-theme="dark"]{
  --bg:#0f1115; --panel:#171a21; --panel2:#1e222b; --border:#2a2f3a;
  --text:#e8eaed; --text2:#9aa0ac; --text3:#6b7280;
  --accent:#5b9dd9; --accent-bg:#1c2836;
  --green:#5cb85c; --amber:#e0a458; --red:#e05c5c; --purple:#a67dd4; --teal:#4cbfb3;
  --req:#e05c5c; --ph:#1a1e26;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:var(--ff);background:var(--bg);color:var(--text);
  font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased}
input,select,textarea,button{font-family:inherit;font-size:inherit;color:inherit}

/* ============ 顶栏 ============ */
.top{position:sticky;top:0;z-index:100;background:var(--panel);
  border-bottom:1px solid var(--border);box-shadow:var(--sh)}
.top-in{max-width:1560px;margin:0 auto;padding:12px 22px;
  display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:210px}
.brand .logo{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;
  background:var(--accent-bg);color:var(--accent);font-size:16px;flex-shrink:0}
.brand h1{font-size:15px;font-weight:600;letter-spacing:.3px}
/* v1.9：版本号徽章。放标题右侧，与副行的「模板版本」是两回事——
   APP_VER = 工具本身的版本（每次迭代变），模板版本 = T1-1 策划模板的版本（很少变）。
   两者混在一行会让人误以为「模板 v3.0」就是工具版本，故拆开。 */
.brand .vt{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ver-badge{display:inline-flex;align-items:center;gap:4px;font-family:var(--fm);
  font-size:10.5px;font-weight:700;letter-spacing:.4px;color:var(--accent);
  background:var(--accent-bg);border:1px solid var(--accent);
  border-radius:20px;padding:1px 8px;white-space:nowrap}
.brand .sub{font-size:11px;color:var(--text3);margin-top:-2px}

.prog{flex:1;min-width:220px;max-width:380px}
.prog-hd{display:flex;justify-content:space-between;font-size:11px;
  color:var(--text2);margin-bottom:5px}
.prog-hd b{color:var(--accent);font-variant-numeric:tabular-nums}
.bar{height:6px;background:var(--ph);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:3px;
  transition:width .35s cubic-bezier(.4,0,.2,1)}

.tools{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.seg{display:flex;background:var(--panel2);border:1px solid var(--border);
  border-radius:var(--r2);overflow:hidden}
.seg button{background:transparent;border:none;padding:6px 12px;cursor:pointer;
  font-size:12px;color:var(--text2);transition:.14s;border-right:1px solid var(--border)}
.seg button:last-child{border-right:none}
.seg button:hover{color:var(--text)}
.seg button.on{background:var(--accent);color:#fff;font-weight:500}
html[data-theme="dark"] .seg button.on{color:#0f1115}
.btn{background:var(--panel2);border:1px solid var(--border);color:var(--text2);
  padding:7px 13px;border-radius:var(--r2);cursor:pointer;font-size:12px;
  transition:.14s;white-space:nowrap}
.btn:hover:not(:disabled){color:var(--text);border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:500}
html[data-theme="dark"] .btn.pri{color:#0f1115}
.btn.pri:hover{opacity:.9}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:4px 9px;font-size:11px}

/* ============ 存储容量指示（v1.1）============
   放在顶栏末尾，宽度固定 74px，不挤动其他按钮。
   常态只显示一条极细的进度线，hover 才展开数字——不打扰日常填写。 */
.cap{width:74px;flex:0 0 74px;align-self:center;cursor:default;user-select:none}
.cap-t{display:flex;justify-content:space-between;font-size:9.5px;
  color:var(--text3);line-height:1.4;margin-bottom:2px;
  font-variant-numeric:tabular-nums}
.cap-b{height:3px;border-radius:2px;background:var(--panel2);overflow:hidden}
.cap-f{height:100%;border-radius:2px;background:var(--accent);
  transition:width .25s ease}
.cap.warn .cap-t{color:var(--warn,#b8860f)}
.cap.warn .cap-f{background:var(--warn,#b8860f)}
.cap.full .cap-t{color:#c0392b;font-weight:500}
.cap.full .cap-f{background:#c0392b}

/* ============ 布局 ============ */
.shell{max-width:1560px;margin:0 auto;display:grid;
  grid-template-columns:212px 1fr;gap:0;align-items:start}
.side{position:sticky;top:59px;padding:20px 12px 40px 22px;
  max-height:calc(100vh - 59px);overflow-y:auto}
.side-t{font-size:10px;color:var(--text3);text-transform:uppercase;
  letter-spacing:1.2px;padding:0 8px 10px}
.nav a{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:var(--r2);
  text-decoration:none;color:var(--text2);font-size:12.5px;transition:.14s;
  border-left:2px solid transparent}
.nav a:hover{background:var(--panel2);color:var(--text)}
.nav a.on{background:var(--accent-bg);color:var(--accent);font-weight:500;
  border-left-color:var(--accent)}
.nav a .st{font-size:10px;margin-left:auto;font-variant-numeric:tabular-nums;
  color:var(--text3);flex-shrink:0}
.nav a.done .st{color:var(--green)}
.nav a.part .st{color:var(--amber)}
.nav .gap{height:1px;background:var(--border);margin:9px 8px}
.nav .dim{opacity:.55}
/* v1.7 两级导航：一级章节行 + 可折叠子节 */
.navgrp{border-radius:var(--r2)}
.navgrp.done>a .st{color:var(--green)}
.navgrp.part>a .st{color:var(--amber)}
.navrow{display:flex;align-items:stretch;position:relative}
.navrow>a{flex:1;min-width:0}
.caret{position:absolute;right:6px;top:50%;transform:translateY(-50%);
  background:var(--panel2);border:1px solid var(--border);color:var(--text3);
  width:20px;height:20px;border-radius:var(--r3);cursor:pointer;font-size:9px;
  display:grid;place-items:center;transition:.16s;padding:0;line-height:1}
.caret:hover{color:var(--accent);border-color:var(--accent)}
.caret.open{transform:translateY(-50%) rotate(180deg)}
.navrow>a:has(+ .caret){padding-right:30px}
.navsubs{padding:2px 0 4px 12px;margin-left:9px;border-left:1px dashed var(--border)}
.navsubs a{display:block;padding:4px 10px;font-size:11.5px;color:var(--text3);
  border-left:none;border-radius:0 var(--r3) var(--r3) 0}
.navsubs a:hover{background:var(--panel2);color:var(--text)}
.navsubs a.on{color:var(--accent);background:var(--accent-bg);font-weight:500}
.gapnote{font-size:10px;color:var(--text3);opacity:.72;padding:4px 10px;
  margin:3px 0 6px;border-left:2px solid var(--border);line-height:1.5}
/* 锚点跳转时不被吸顶条遮住 */
[id^="anc-"]{scroll-margin-top:74px}

.main{padding:20px 26px 90px;min-width:0}

/* ============ 章节卡 ============ */
.sec{background:var(--panel);border:1px solid var(--border);border-radius:var(--r);
  padding:22px 24px;margin-bottom:18px;scroll-margin-top:74px}
.sec-h{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.sec-h h2{font-size:15px;font-weight:600}
.sec-n{font-family:var(--fm);font-size:11px;color:var(--text3);
  background:var(--panel2);padding:2px 7px;border-radius:var(--r3)}
.badge{font-size:10px;padding:2px 8px;border-radius:20px;margin-left:auto;white-space:nowrap}
/* v1.0.2：随「原型做实 / 占位」徽标一同移除 .b-req 与 .b-off
   ——12 章节已全部做实，两者已成死代码。保留 .b-rec（含义强制项）。 */
.b-rec{background:rgba(184,117,20,.12);color:var(--amber)}
.sec-d{font-size:12px;color:var(--text3);margin-bottom:16px;
  padding-bottom:14px;border-bottom:1px dashed var(--border)}
h3{font-size:12px;font-weight:600;color:var(--text2);margin:20px 0 10px;
  letter-spacing:.4px;display:flex;align-items:center;gap:7px}
h3:first-of-type{margin-top:6px}
h3::before{content:"";width:3px;height:12px;background:var(--accent);border-radius:2px}

/* ============ 表单 ============ */
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
/* v1.5 补齐 .g5（此前从未定义，导致 §4 场地参考图与 §11 参考样片
   虽写了 grid g5 却实际单列纵向堆叠，一屏看不全）。
   图片类网格统一用 auto-fill + 最小列宽：容器变宽自动多排，变窄自动少排，
   比固定 5 列更能「排布整齐」且不会溢出。 */
.g5{grid-template-columns:repeat(5,1fr)}
/* v1.8：固定一行 4 张（不再 auto-fill 自适应），保证网格整齐 */
.gimg{grid-template-columns:repeat(4,1fr);gap:9px}
@media(max-width:1100px){.g3,.g4,.g5{grid-template-columns:repeat(2,1fr)}}
@media(max-width:760px){.g2,.g3,.g4,.g5{grid-template-columns:1fr}}

.f{display:flex;flex-direction:column;gap:5px;min-width:0}
.f label{font-size:11.5px;color:var(--text2);display:flex;align-items:center;gap:5px}
.req{color:var(--req);font-weight:700;font-size:13px;line-height:1}
.rec{color:var(--amber);font-size:11px}
.f input,.f select,.f textarea{background:var(--panel2);border:1px solid var(--border);
  border-radius:var(--r2);padding:8px 11px;font-size:13px;width:100%;transition:.14s}
.f textarea{resize:vertical;min-height:62px;line-height:1.65}
.f input:focus,.f select:focus,.f textarea:focus{
  outline:none;border-color:var(--accent);background:var(--panel)}
.f input.err,.f textarea.err,.f select.err{border-color:var(--req);
  background:rgba(196,61,61,.05)}
.f .hint{font-size:10.5px;color:var(--text3)}
.f .miss{font-size:10.5px;color:var(--req);display:flex;align-items:center;gap:3px}
.f input::placeholder,.f textarea::placeholder{color:var(--text3);opacity:.7}

/* ============ 表格 ============ */
.tbl-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--r2);
  margin-bottom:10px;background:var(--panel)}
table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:560px}
th{background:var(--panel2);padding:8px 10px;font-size:11px;color:var(--text2);
  font-weight:600;text-align:left;border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:5px 8px;border-bottom:1px solid var(--border);vertical-align:middle}
tr:last-child td{border-bottom:none}
tbody tr:hover{background:rgba(47,111,168,.035)}
td input,td select{width:100%;background:transparent;border:1px solid transparent;
  border-radius:var(--r3);padding:6px 8px;font-size:12.5px;transition:.14s}
td input:hover,td select:hover{border-color:var(--border);background:var(--panel2)}
td input:focus,td select:focus{outline:none;border-color:var(--accent);background:var(--panel)}
td input.err{border-color:var(--req);background:rgba(196,61,61,.05)}
th .req{vertical-align:middle}
tr.dragging{opacity:.35}
tr.over td{box-shadow:inset 0 2px 0 var(--accent)}
.rowbtn{background:transparent;border:1px solid var(--border);color:var(--text3);
  width:24px;height:24px;border-radius:var(--r3);cursor:pointer;font-size:12px;
  display:grid;place-items:center;transition:.14s;flex-shrink:0}
.rowbtn:hover{color:var(--req);border-color:var(--req)}
.rowbtn.grip{cursor:grab;color:var(--text3);font-size:11px}
.addrow{display:flex;gap:8px;margin-bottom:18px}

/* ============ 图片槽 ============
   v1.5 改造要点（对应第四批需求 2）：
   1) 完整展示不裁切 —— 原 height:60px + object-fit:cover 会裁掉画面上下，
      改为按宽高比自适应高度 + contain。
   2) 排列整齐 —— 参考图是「排布用」而非终点（终点是导出 PDF/DOCX），
      故槽位统一按 4:3 基准格渲染，同一槽内所有图尺寸一致、网格对齐，
      不同宽高比的图也强制塞进同一比例的格子，视觉上整齐划一。
   3) 删除按钮常驻 —— 原 .rm 只在 hover 时显示（opacity:0），
      触屏与打印场景根本点不到；改为常驻半透明黑底白✕，hover 加深。 */
.pick{width:100%;min-width:74px;aspect-ratio:4/3;border:1.5px dashed var(--border);
  border-radius:var(--r2);background:var(--panel2);cursor:pointer;
  display:grid;place-items:center;transition:.15s;overflow:hidden;position:relative}
.pick:hover{border-color:var(--accent);background:var(--accent-bg)}
.pick .ph{font-size:19px;color:var(--text3);line-height:1}
.pick .lb{font-size:9px;color:var(--text3);margin-top:2px}
.pick.filled{border-style:solid;border-color:var(--accent);padding:0}
/* v1.8 修图片被裁：原用 width/height:100%，但 .pick 是 display:grid，
   百分比高度在 grid 容器里解析失败会退化成 auto —— 极端比例的图
   （如600×100）会撑到几百px 高被 overflow:hidden 切掉。
   改为绝对定位铺满格子 + object-fit:contain，整张图完整可见（不足处留白）。 */
.pick.filled img{position:absolute;inset:0;width:100%;height:100%;
  object-fit:contain;display:block;background:var(--panel2)}
/* 常驻删除按钮：不用 hover 触发，触屏/打印都能点 */
.pick .rm{position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:50%;
  background:rgba(0,0,0,.58);color:#fff;border:none;cursor:pointer;font-size:12px;
  display:grid;place-items:center;opacity:1;transition:.15s;line-height:1;
  font-weight:700;z-index:2}
.pick .rm:hover{background:rgba(198,40,40,.94);transform:scale(1.12)}
.pick.drop{border-color:var(--accent);background:var(--accent-bg);border-style:solid}

/* v1.9：原 §6.6「汇总条」.genbar / .gb 样式随「生成总清单」按钮一并移除。
   器材改为 6.5 只读聚合表，改完 6.1–6.4 即时反映，无需点按钮。
   .genbar 名字保留在 @media print 的隐藏清单里也无害（无元素即无匹配）。 */

/* ============ §0↔§1 / §0↔§4 同步摘要卡（v1.7）============ */
.syncbox{border:1px solid var(--border);border-left:3px solid var(--accent);
  border-radius:0 var(--r2) var(--r2) 0;background:var(--panel2);padding:10px 13px;margin-top:10px}
.syncbox-h{display:flex;align-items:center;gap:9px;flex-wrap:wrap;
  font-size:11.5px;color:var(--accent);font-weight:600;margin-bottom:7px}
.syncbox-h .btn{margin-left:auto}
.syncbox-b{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:13px}
.syncbox-b .tag{font-size:10.5px;color:var(--text2);background:var(--panel);
  border:1px solid var(--border);border-radius:20px;padding:1px 8px;white-space:nowrap}
.syncbox-b .tag-warn{color:var(--amber);border-color:var(--amber);
  background:rgba(184,117,20,.08)}
.syncbox-n{font-size:11.5px;color:var(--text2);margin-top:6px;
  padding-top:6px;border-top:1px dashed var(--border);line-height:1.6}

/* ============ §7 行程甘特图（可拖拽 · v1.7）============ */
/* 时间轴范围：早于最早事项 1 小时、晚于最晚结束 1 小时，两端对齐到整点，
   保证刻度是整数小时；最小跨度6 小时，避免只有一项时被拉得过度稀疏。*/
.gt{margin:10px 0 4px;border:1px solid var(--border);border-radius:var(--r2);
  background:var(--panel);overflow:hidden;user-select:none}
.gt-head{position:relative;height:60px;background:var(--panel2);
  border-bottom:1px solid var(--border)}
/* v1.0.11：轴高 42→60px，容纳节点标签错位后的第二行 */
.gt-slotrow{position:absolute;left:0;right:0;top:30px;height:30px}
.gt-slotrow .gt-slot{display:none}
.gt-tick{position:absolute;top:0;bottom:0;border-left:1px solid var(--border);
  font-size:10px;color:var(--text3);font-family:var(--fm);padding-left:4px;
  display:flex;align-items:center;pointer-events:none}
.gt-tick.major{color:var(--text2);font-weight:600;border-left-color:var(--text3)}
.gt-now{position:absolute;top:0;bottom:0;width:0;border-left:2px dashed var(--accent);
  opacity:.55;pointer-events:none;z-index:3}
.gt-now::after{content:'现在';position:absolute;top:2px;left:4px;font-size:9px;
  color:var(--accent);white-space:nowrap}
/* 关键节点（黄金时刻 / 日落…）：整列高亮的竖向标记 */
.gt-slot{position:absolute;top:0;bottom:0;background:var(--c);opacity:.075;
  pointer-events:none;z-index:0}
.gt-slotlab{position:absolute;top:0;font-size:9.5px;color:var(--c);
  font-weight:600;white-space:nowrap;z-index:4;opacity:.85;
  background:transparent;border:none;cursor:pointer;padding:0 3px;border-radius:3px;
  font-family:inherit;transition:.14s;line-height:16px}
.gt-slotlab:hover{opacity:1;background:var(--panel);box-shadow:0 1px 4px rgba(0,0,0,.14)}
/* v1.0.11：标签错位时用的引线，从轴顶拉到被挤下来的那一行 */
.gt-slotlab-lead{position:absolute;top:0;width:0;border-left:1px dashed currentColor;
  opacity:.45;z-index:3;pointer-events:none}
.gt-slotlab-lead{color:var(--text3)}
/* v1.9 需求4：与 8.2 联动的节点标签加重 + 「参考」角标（未联动时才显示） */
.gt-slotlab.linked{font-weight:700;opacity:1}
.gt-slotlab .ref{font-style:normal;font-size:8.5px;opacity:.7;margin-left:2px;
  padding:0 2px;border:1px solid currentColor;border-radius:3px}
.lnk-mark{font-size:9.5px;color:var(--accent);white-space:nowrap;flex-shrink:0;
  padding:1px 4px;border:1px solid var(--accent);border-radius:3px;
  background:var(--accent-bg);font-family:var(--fm)}
tr.gt-linked td{background:var(--accent-bg)}
tr.gt-linked .lnk-mark{font-weight:600}
@keyframes rowflash{0%,100%{background:transparent}
  15%,60%{background:color-mix(in srgb,var(--accent) 18%,transparent)}}
tr.flash td{animation:rowflash 1.4s ease-out}
/* 拖拽时的对齐参考线 */
.gt-guide{position:absolute;top:60px;bottom:0;width:0;border-left:1px dashed var(--accent);
  opacity:.5;pointer-events:none;z-index:8;display:none}
.gt-rows{position:relative}
.gt-row{position:relative;height:34px;border-bottom:1px dashed var(--border)}
.gt-row:last-child{border-bottom:none}
.gt-row:nth-child(even){background:rgba(127,127,127,.022)}
.gt-rowlab{position:absolute;left:0;top:0;bottom:0;width:1px}
.gt-bar{position:absolute;top:5px;height:24px;border-radius:5px;
  background:var(--c);border:1.5px solid var(--c);color:#fff;
  display:flex;align-items:center;padding:0 8px;font-size:11px;cursor:grab;
  overflow:hidden;white-space:nowrap;transition:box-shadow .14s,filter .14s;
  box-shadow:0 1px 3px rgba(0,0,0,.14);z-index:2}
.gt-bar:hover{filter:brightness(1.08);box-shadow:0 3px 10px rgba(0,0,0,.2)}
.gt-bar.slim{padding:0 3px}
.gt-bar.slim .gt-t,.gt-bar.slim .gt-d{display:none}
.gt-bar.dragging{cursor:grabbing;box-shadow:0 8px 22px rgba(0,0,0,.3);
  filter:brightness(1.12);z-index:9;opacity:.95}
.gt-bar .gt-t{overflow:hidden;text-overflow:ellipsis;pointer-events:none}
.gt-bar .gt-d{font-family:var(--fm);font-size:10px;opacity:.9;margin-left:auto;
  padding-left:8px;pointer-events:none}
/* 左右边缘的手柄：拖动改时长 */
.gt-h{position:absolute;top:0;bottom:0;width:8px;cursor:ew-resize;z-index:3}
.gt-h::after{content:'';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  width:2px;height:11px;border-radius:1px;background:rgba(255,255,255,.75)}
.gt-h.l{left:0} .gt-h.r{right:0}
.gt-bar:hover .gt-h::after{background:#fff}
/* v1.0.11：光影时刻（黄金/蓝调）手填覆盖区 */
.solarbox{border:1px solid var(--border);border-left:3px solid #b8863f;
  border-radius:0 var(--r2) var(--r2) 0;background:var(--panel2);
  padding:11px 13px;margin:2px 0 10px}
.solarbox-h{display:flex;align-items:center;gap:9px;flex-wrap:wrap;
  font-size:12.5px;margin-bottom:6px}
.solarbox-h .tag{font-size:10.5px;color:var(--text2);background:var(--panel);
  border:1px solid var(--border);border-radius:20px;padding:1px 8px}
.solarbox-h .tag-warn{color:var(--amber);border-color:var(--amber);background:rgba(184,117,20,.08)}
.solarbox-n{font-size:11px;color:var(--text2);line-height:1.65;margin-bottom:9px}
.solarbox-n a{color:var(--accent)}
.solarbox-g{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.solarbox-g .f label{font-size:11.5px}
.solarbox-g .f .hint{margin-top:2px}
@media(max-width:900px){.solarbox-g{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){.solarbox-g{grid-template-columns:1fr}}
.gt-hint{display:flex;align-items:center;gap:9px;flex-wrap:wrap;
  font-size:10.5px;color:var(--text3);padding:6px 2px 0}
.gt-hint kbd{font-family:var(--fm);font-size:9.5px;background:var(--panel2);
  border:1px solid var(--border);border-radius:3px;padding:0 4px;color:var(--text2)}
/* v1.0.11：光影时刻手填覆盖区属编辑期工具，打印件里隐藏。
   与 .genbar 同理——策划案打出来给现场看，不需要让人回去填时刻。
   （v1.0.14 预览态由 initPvMirror 镜像本块规则自动生效）*/
@media print{.solarbox{display:none!important}}

/* 打印：甘特图无交互，只作为静态示意（原核对态语义，v1.0.14 归入打印态） */
@media print{.gt-h{display:none}.gt-bar{cursor:default}}

/* 窄屏横向滚动 */
@media(max-width:760px){.gt{overflow-x:auto}.gt-inner{min-width:560px}}
/* 甘特图打印样式已统一收敛到文末的 @media print，此处不再重复定义 */

/* ============ 复选 / 计算器 / 灯箱 ============ */
.ck{display:flex;align-items:flex-start;gap:7px;font-size:12.5px;
  color:var(--text2);cursor:pointer;padding:5px 0;line-height:1.5}
.ck input{width:auto;min-width:0;flex-shrink:0;margin-top:2px;cursor:pointer;
  accent-color:var(--accent)}
.calc{background:var(--accent-bg);border:1px solid var(--accent);border-radius:var(--r2);
  padding:12px 14px;margin:10px 0}
.calc .ct{font-size:11px;color:var(--accent);font-weight:600;margin-bottom:8px;
  display:flex;align-items:center;gap:6px}
.calc .cf{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end}
.calc .cf .f{flex:1;min-width:82px}
.calc .cf input{background:var(--panel)}
.calc .co{font-size:12.5px;margin-top:10px;padding-top:9px;
  border-top:1px dashed var(--border);color:var(--text2)}
.calc .co b{color:var(--accent);font-size:16px;font-variant-numeric:tabular-nums;
  margin:0 3px}
.calc .fx{font-family:var(--fm);font-size:10.5px;color:var(--text3);margin-top:5px}

#lb{display:none;position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:9999;
  place-items:center;cursor:zoom-out;padding:26px}
#lb.on{display:grid}
#lb img{max-width:94vw;max-height:92vh;border-radius:var(--r2);

/* 占位 */
.ph-box{background:var(--ph);border:1px dashed var(--border);border-radius:var(--r2);
  padding:22px;text-align:center;color:var(--text3);font-size:12.5px}
.ph-box b{display:block;color:var(--text2);font-size:13px;margin-bottom:5px;font-weight:500}

.note{font-size:11.5px;color:var(--text2);background:var(--panel2);
  border-left:3px solid var(--accent);border-radius:0 var(--r2) var(--r2) 0;
  padding:10px 13px;margin:12px 0}
.warn{border-left-color:var(--amber)}
.ok{color:var(--green)}

.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:9998;display:none;
  place-items:center;padding:26px}
.modal.on{display:grid}
.modal-c{background:var(--panel);border:1px solid var(--border);border-radius:var(--r);
  max-width:540px;width:100%;padding:24px 26px;box-shadow:0 20px 60px rgba(0,0,0,.3);
  max-height:86vh;overflow-y:auto}

.modal-c h3::before{display:none}
.miss-list{max-height:270px;overflow-y:auto;margin:14px 0;padding:11px;
  background:var(--ph);border-radius:var(--r2);font-size:12.5px}
.miss-list div{padding:3px 0;color:var(--text2)}
.miss-list b{color:var(--req)}
.modal-f{display:flex;gap:9px;justify-content:flex-end}

/* v1.0.14：原「核对态」样式块已整体移除。
   核对功能（含 body[data-mode="check"] 系列规则）按需求裁决不再保留 ——
   预览过程本身即是核对：发现排版/内容问题直接关闭浮层回到编辑态修改。
   预览态所需的"只读、无交互控件"表现由 @media print,.pv-scope 共用样式源统一提供。 */

/* ============ 打印样式（v1.0.14 · P1-A）============
   ★ 单一样式事实源 ★
   预览浮层内的内容必须与导出 PDF「100% 一致」。实现方式：
   本块仍以标准 `@media print` 书写（唯一维护点），
   运行时由 JS（见 initPvMirror）读取本块的 cssText，
   为每条选择器加上 `.pv-scope ` 前缀，注入到一个独立 <style>，
   使同一份规则在预览态与打印态**同时生效**。

   为什么不用 `@media print, .pv-scope{...}` 的写法：
   `@media` 的后续参数被解析为**媒体类型/特性**，`.pv-scope` 不是合法媒体类型，
   整条 media query 会被归一化为 `not all` 而**永不匹配**（Chromium 实测确证），
   导致块内所有规则在屏幕态下静默失效。
   故改用「打印块 + JS 镜像」：既保持单一维护点，又能真正作用到预览浮层。 */
@media print{
  html[data-theme="light"],html[data-theme="dark"]{
    --bg:#fff;--panel:#fff;--panel2:#fff;--border:#bbb;--ph:#fff;
    --text:#000;--text2:#333;--text3:#666;--accent:#000;--accent-bg:#fff
  }
  @page{size:A4 portrait;margin:14mm 12mm}
  /* ---- v1.8：PDF 只呈现「策划安排本身」，一切注释/提示/操作痕迹全部剔除 ----
     ① .hint 字段说明 ② .rec 推荐标签 ③ .note/.miss 提示块（.miss=「⚠强制项未填」）
     ④ .req 强制项星号 ⑤ .badge 徽标 ⑥ .gt-hint 甘特图操作说明
     ⑦ .genbar 汇总条（生成按钮是工具，不是内容）⑧ .calc .fx/.co 计算说明
     ⑨ .cap 存储容量条（编辑期防护，与内容无关）⑩ .pick .lb/.ph/.rm 上传框文字与删除钮
     ⑪ .sec-d 章节导语 ⑫ .gapnote 断档说明 ⑬ .syncbox-h 卡片内的操作按钮与脚注
     ⑭ input::placeholder 全部不打印 —— PDF 只呈现策划安排的内容本身 */
  .top,.side,.addrow,.rowbtn,.tools,.modal,#lb,.no-print,
  .hint,.rec,.note,.miss,.req,.badge,.gt-hint,.genbar,.cap,
  .calc .fx,.calc .co,.pick .lb,.pick .ph,.pick .rm,
  .sec-d,.gapnote,.syncbox-h,.co,.lnk-mark,.gt-slotlab .ref{ display:none!important }
  /* ---- v1.0.14 缺陷 D-1 修复：打印态剔除表单控件残影（预览功能发现的真实缺陷）----
     除上述"编辑期元素"外，还有一类**交互控件本体**会被 pdf() 捕获：
     ① 分配编号 / 重新分配、清除手填等 .btn 按钮
     ② 甘特图上的可点击时段标签（.gt-slotlab，是 <button>）
     ③ 日期输入框的日历图标（::-webkit-calendar-picker-indicator）
     处理原则：按钮整块隐藏；甘特标签只去"控件外观"保留文字；图标隐藏。 */
  .btn,.gt-slotlab-lead{display:none!important}
  .gt-slotlab{cursor:auto;padding:0;background:transparent!important;
    box-shadow:none!important;pointer-events:none}
  .gt-slotlab .ref{display:none!important}
  input[type=date]::-webkit-calendar-picker-indicator,
  input[type=time]::-webkit-calendar-picker-indicator{display:none!important}
  /* 未选中的下拉框：占位项「— 请选择 —」不得作为字段值出现在 PDF 中。
     注意：Chromium 对**已选中**的 option 会强制渲染，CSS 的 display:none 拦不住，
     因此这里只做"尽力而为"，真正的兜底由导出路径的 JS 收口（见 printGate）。 */
  select option[value=""]{display:none!important}
  /* 计数类灰字（3/8、样图 0/2）同样是编辑期状态，不是策划内容 */
  .f label span[style*="text3"]{display:none!important}
  .shell{display:block;max-width:none}
  .main{padding:0}
  .sec{break-inside:avoid-page;page-break-inside:avoid;border:1px solid #ccc;
    margin:0 0 10pt;padding:12pt;box-shadow:none;border-radius:0}
  table{min-width:0;font-size:9pt}
  th{background:#f0f0f0!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  tr,td{break-inside:avoid}
  /* 图片：完整显示整张、不裁切；一行 4 张与屏幕一致。
     屏幕态图片是 position:absolute（配合 object-fit:contain 完整显示），
     打印时必须改回 static 正常流 —— 绝对定位在分页/解除 aspect-ratio 后
     会让格子高度塌成 0，图片被压成一条细线。 */
  .pick{aspect-ratio:auto;height:auto;min-height:0}
  .pick.filled{height:34mm;padding:0}
  .pick.filled img{position:static;display:block;width:100%;height:100%;
    max-height:34mm;object-fit:contain}
  input,textarea,select{border:transparent!important;background:transparent!important;
    padding:2px 0!important;font-size:9pt}
  /* v1.0.14 缺陷 D-1 续：去除 select 右侧的原生下拉箭头（▼），
     它属控件外观、不是策划内容。 */
  select{appearance:none;-webkit-appearance:none;-moz-appearance:none;
    background-image:none!important}
  input::placeholder,textarea::placeholder,
  input::-webkit-input-placeholder,textarea::-webkit-input-placeholder{
    color:transparent!important;opacity:0!important}
  .calc{background:#f6f6f6!important;border-color:#999;
    -webkit-print-color-adjust:exact;print-color-adjust:exact}
  .grid.gimg,.grid.g4{grid-template-columns:repeat(4,1fr)!important;
    align-items:start}
}

/* ============ 预览浮层（v1.0.14 · P1-A）============
   注意：以下规则**不在** @media print 内 —— 预览浮层本身在打印时必须消失
   （见稍后 @media print 对 #pv 的隐藏），否则会把浮层打进 PDF。*/
.pv{position:fixed;inset:0;z-index:9997;display:none;
  background:var(--bg);flex-direction:column}
.pv.on{display:flex}

/* --- 顶部工具条（不属于纸面内容，导出时不出现）--- */
.pv-bar{flex-shrink:0;display:flex;align-items:center;gap:14px;
  padding:9px 16px;background:var(--panel);border-bottom:1px solid var(--border);
  box-shadow:0 1px 6px rgba(0,0,0,.06);position:relative;z-index:2}
.pv-bar-l{display:flex;align-items:baseline;gap:9px;min-width:0}
.pv-tag{font-size:11px;font-weight:600;color:var(--accent);
  background:var(--accent-bg);border:1px solid var(--accent);
  border-radius:999px;padding:2px 9px}
.pv-sub{font-size:11.5px;color:var(--text3);white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.pv-bar-c{margin-left:auto;font-size:12px;color:var(--text2);
  font-variant-numeric:tabular-nums;white-space:nowrap}
.pv-bar-c b{color:var(--accent);font-size:14px;margin:0 2px}
.pv-bar-r{display:flex;align-items:center;gap:8px;flex-shrink:0}
.pv-warn{font-size:11.5px;color:var(--amber);white-space:nowrap}

/* --- 缺项气泡：横向条，位于纸面之外 --- */
.pv-miss{flex-shrink:0;background:#fff8e6;border-bottom:1px solid #f0d9a0;
  color:#8a6d1f;font-size:12px;padding:8px 16px;line-height:1.6}
.pv-miss b{color:#b45309}
.pv-miss .pv-miss-list{color:#8a6d1f;opacity:.92}

/* --- 滚动区 + 居中舞台 --- */
.pv-scroll{flex:1;overflow:auto;background:#e9edf1;
  padding:22px 0 60px}
.pv-stage{display:flex;justify-content:center;min-width:min-content}

/* --- 纸面：版心宽 186mm；高度不限（单纸面连续流）--- */
.pv-paper{position:relative;width:186mm;background:#fff;
  box-shadow:0 2px 18px rgba(0,0,0,.16);border-radius:2px;
  /* 上下留白对应 @page 的 14mm 垂直边距，使首行位置与 PDF 一致 */
  padding:14mm 0}
.pv-content{padding:0}

/* --- 分页虚线层 --- */
.pv-rules{position:absolute;left:-12mm;right:-12mm;top:0;bottom:0;
  pointer-events:none}
.pv-rule{position:absolute;left:0;right:0;height:0;
  border-top:1.5px dashed #c0392b;opacity:.85}
.pv-rule-lb{position:absolute;right:4px;transform:translateY(-50%);
  font:10px/1 ui-monospace,monospace;color:#c0392b;
  background:#fff;padding:1px 5px;border:1px solid #e6b0aa;border-radius:3px}
/* 页内上半区/下半区底色微差，辅助判断"哪一页" */
.pv-rule-zone{position:absolute;left:0;right:0;background:transparent}

/* 窄屏：纸面横向缩放适配 */
@media(max-width:820px){
  .pv-bar{flex-wrap:wrap;gap:8px}
  .pv-bar-c{margin-left:0}
  .pv-stage{justify-content:flex-start;padding-left:12px}
}

/* ★ 打印时预览浮层必须整体消失（它是核验工具，不是策划内容） */
@media print{
  .pv{display:none!important}
}
</style>
</head>
<body data-mode="edit">

<div class="top"><div class="top-in">
  <div class="brand">

    <div>

<!-- ==========================================================================
     预览浮层（v1.0.14 · P1-A 新增）
     --------------------------------------------------------------------------
     目的：导出前核验。所见 = 导出所得（共用 @media print,.pv-scope 样式源）。
     版心 186mm × 269mm（A4 纵向 @page margin:14mm 12mm 下的实际可打印区）。
     ★ 为什么是「单纸面 + 分页虚线」而不是真正的多张纸：
       阶段 0 实测证明屏幕介质下 Chromium 不执行分页（fragmentation），
       CSS 多列（P2′）断裂算法与页断裂是两套实现，恒定偏差 −2 页。
       故预览不追求「复现分页」，而是「可预测 + 可核对」：
       一张连续纸 + 每 269mm 一道分页虚线 + 页码，供判断排版是否被切断。
       （P1-A 定位，用户已裁决接受 ±1 页分页线偏差）
     ========================================================================== -->
<div class="pv" id="pv">
  <div class="pv-bar">
    <div class="pv-bar-l">
      <span class="pv-tag">预览</span>
      <span class="pv-sub">所见即导出效果 · A4 纵向</span>
    </div>
    <div class="pv-bar-c" id="pvPageInfo">共 <b>0</b> 页</div>
    <div class="pv-bar-r">
      <span class="pv-warn" id="pvWarn" hidden></span>
      <button class="btn sm" id="pvClose" title="关闭预览（Esc）">✕ 返回编辑</button>
      <button class="btn sm pri" id="pvPrint" title="从预览直接导出 PDF">⤓ 打印 / 存 PDF</button>
    </div>
  </div>
  <!-- 必填项缺项气泡：位于纸面**外**（顶部条），不入内容流，不污染导出 -->

<script>
/* ==========================================================================
   0. 存储安全层（v1.0.12 新增）—— 全局唯一的 localStorage 读写入口
   --------------------------------------------------------------------------
   【为什么必须有这一层 —— 血泪教训，见 BC-20261005 白屏故障】
   本工具是「单文件、零依赖、双击即用」，全部数据存在浏览器 localStorage。
   而本脚本是一整段顶层 <script>：**任何一处顶层抛错，整段脚本终止**，
   表现为「顶栏按钮还在（HTML 静态内容），但导航为空、主体全白」，
   用户完全不知道发生了什么。

   历史缺陷：曾有三处裸 `JSON.parse(localStorage.getItem(k))` 无任何防护：
     - sw_usedno   编号流水
     - sw_models   模特库
     - sw_venues   场地库
   只要这三个键之一：
     ① 存过非法 JSON（异常退出写半个 / 手改 / 扩展污染 / 旧版残留），或
     ② localStorage 本身不可用（隐私模式 / 站点策略禁用 / file:// 受限）
   就会在第一行抛错 → 整页白屏。实测：本地 file:// 与线上 GitHub Pages 同样中招。

   本层对策：**读取永不抛错**。三种失败全部兜底为默认值，并把脏数据
   备份到 `<key>__broken` 后清掉，让用户下次打开自动恢复正常。
   另加 window.__booted 哨兵，供 §0.1 白屏兜底判断首绘是否真的跑完。
   ========================================================================== */
const LS_NS = {
  /* 是否可用：试探性写入再删除，隐私模式/禁用会抛错 */
  ok: (function(){
    try {
      const t = '__ls_probe__';
      localStorage.setItem(t, '1');
      localStorage.removeItem(t);
      return true;
    } catch (e) { return false; }
  })()
};

/* 原始读取：任何异常都返回 null，绝不外抛 */
function lsRaw(key){
  try { return localStorage.getItem(key); }
  catch (e) { return null; }
}

/* 安全写入：任何异常都静默失败（例如配额满），返回是否成功 */
function lsSet(key, val){
  try { localStorage.setItem(key, val); return true; }
  catch (e) { return false; }
}

/* 安全读取 + JSON 解析 + 结构校验。
   - fallback：解析失败或结构不符时的默认值（会被深拷贝一份返回）
   - guard：可选的结构校验函数，返回 false 视为数据损坏
   - opts.keepOnBad：损坏时**只备份、不删除**主键。
     用于「用户核心数据」（整案草稿 sw_doc_v01）—— 这类数据宁可多留一份
     残缺的，也不能因一次误判就清掉；缓存类数据（模特库/场地库）才适合
     直接重置，因为它们可从别处重建。
   命中损坏时：把原值备份到 `${key}__broken`（覆盖上一份），
   非 keepOnBad 时再删除主键，使下一次启动回到干净状态。 */
function lsJSON(key, fallback, guard, opts){
  const keep = !!(opts && opts.keepOnBad);
  const clone = v => { try { return JSON.parse(JSON.stringify(v)); } catch(e){ return v; } };
  const bad = (why) => {
    const old = lsRaw(key);
    if (old !== null) {
      lsSet(key + '__broken', old);   // 留证，便于事后排查
      if (!keep) { try { localStorage.removeItem(key); } catch (e) {} }
    }
    if (window.console && console.warn) {
      console.warn('[safeLS] 键 "' + key + '" 数据损坏' + (keep ? '（已备份，保留原值）' : '已重置') + ' → ' + why);
    }
    return clone(fallback);
  };
  if (!LS_NS.ok) return clone(fallback);      // 存储不可用 → 直接给默认值
  const s = lsRaw(key);
  if (s === null || s === '') return clone(fallback);
  let v;
  try { v = JSON.parse(s); }
  catch (e) { return bad('JSON 解析失败：' + (e && e.message || e)); }
  if (guard && !guard(v)) return bad('结构校验未通过');
  return v;
}

/* 布尔 / 字符串等简单值的安全读写 */
function lsStr(key, fallback){
  const s = lsRaw(key);
  return (s === null) ? (fallback === undefined ? null : fallback) : s;
}

/* ---- lsArr：数组专用读取器（v1.0.13 新增）----
   血泪教训 #2（见 BC-20261005 白屏故障 · B 面）：v1.0.12 的 guard 只校验了
   「最外层是不是数组」，挡不住「数组里塞了非对象元素」。
   只要 sw_models / sw_venues 里出现一个 null / 数字 / 字符串，
   渲染时 `x.姓名` / `x.id` 立刻抛 TypeError → 整段脚本终止 → 又是白屏。

   这是同一缺陷的第二层：v1.0.12 修了「外层」（能否 parse 出数组），
   没修「内层」（数组元素是否合形）。修法放在读取处而非各个渲染处——
   渲染调用点有 8+ 处（MODELS.map / VENUES.map / find / filter / reduce），
   逐个加防护必然漏；在唯一入口过滤一次，全部调用点自动安全。

   filter 规则：保留「非 null 的普通对象」。脏元素直接剔除并备份原值，
   用户损失的是本就不可能渲染的那几条脏记录，换来的是页面永不白屏。 */
function lsArr(key){
  const raw = lsJSON(key, [], Array.isArray);
  const clean = raw.filter(x => x && typeof x === 'object' && !Array.isArray(x));
  if (clean.length !== raw.length){
    const old = lsRaw(key);
    if (old !== null) lsSet(key + '__broken', old);
    lsSet(key, JSON.stringify(clean));
    if (window.console && console.warn)
      console.warn('[safeLS] ' + key + ' 含 ' + (raw.length - clean.length) + ' 条非法元素，已剔除');
  }
  return clean;
}

/* ---- lsDoc：策划案正文读取器（v1.0.13 修复）----
   v1.0.12 只校验了「根是不是对象」，`{s0:null}` 能顺利通过校验并整份覆盖默认值。
   后果：s0 变 null → 首个读 `D.s0.撰写日期` 的地方就抛错 → 白屏。

   修法：以默认值 D 为模板做**浅层合并**，且逐节校验——
   只要某一节不是普通对象，就丢弃该节、保留默认值（其余正常节照常恢复）。
   同时在读取期就把 s0 补全（不依赖后面那行 if(!D.s0.撰写日期)，
   因为它在 s0=null 时会二次抛错）。 */
function lsDoc(key, def, opts){
  const c = lsJSON(key, null, v => v && typeof v === 'object' && !Array.isArray(v), opts);
  if (!c) return null;
  const out = {};
  for (const k in def){
    const dv = def[k], cv = c[k];
    out[k] = (dv && typeof dv === 'object' && !Array.isArray(dv))
      ? (cv && typeof cv === 'object' && !Array.isArray(cv) ? Object.assign({}, dv, cv) : dv)
      : (cv === undefined ? dv : cv);
  }
  /* 补全 s0 缺省字段：编号流水 / 日期都依赖它，缺一个就断链 */
  if (out.s0 && def.s0) for (const k in def.s0) if (out.s0[k] === undefined) out.s0[k] = def.s0[k];
  return out;
}

/* 供电调试：一键清空本工具的全部键（含损坏备份），恢复出厂 */
function lsPurgeAll(){
  const keys = ['sw_doc_v01','sw_usedno','sw_models','sw_venues','sw_solar_override',
                'sw_app_ver',
                'sw_doc_v01__broken','sw_usedno__broken','sw_models__broken','sw_venues__broken'];
  keys.forEach(k => { try { localStorage.removeItem(k); } catch (e) {} });
}

/* ==========================================================================
   2. 编号中枢 ——策划案编号（只读·自动生成）
   --------------------------------------------------------------------------
   编号规则：CX-YYYYMMDD-XX
     CX        固定前缀（Photography Studio）
     YYYYMMDD  撰写日期（回退：拍摄日期 → 今天）
     XX        同一天内的流水号，从 01 开始
     例：CX-20260505-01 = 2026年5月5日制作的第一份策划案
   ─────────────────────────────────────────────────────────────────────────
   编号即主键：导出目录名、文件名、台账行、data.json 全用它，保证可追溯。
   已用流水号存localStorage('sw_usedno')，键为 'CX-YYYYMMDD' → 已分配的最大序号。
   M4 入库时由资料库二次校验并回写，避免多人离线撞号。
   ========================================================================== */
const AUTO_NO = {
  prefix: 'CX',
  /* v1.0.12：改走 lsJSON，脏数据/存储不可用一律回退空对象，
     绝不再因单个键损坏而中断整段脚本（原为裸 JSON.parse，白屏元凶之一）
     v1.0.13：guard 补 !Array.isArray —— 空数组 [] 也能"是对象"，
     一旦残留成数组，reserve() 写 this.used[k] 会静默丢弃（数组不认字符串键），
     编号流水从此永不前进，同一天反复给出 CX-YYYYMMDD-01。 */
  used: lsJSON('sw_usedno', {}, v => v && typeof v === 'object' && !Array.isArray(v)),
  key(d){ return this.prefix+'-'+(d||'').replace(/-/g,''); },
  /* 生成下一个可用编号；baseDate 为空则用今天 */
  next(baseDate){
    const d = baseDate || new Date().toISOString().slice(0,10);
    const k = this.key(d), n = (this.used[k] || 0) + 1;
    return { no: k+'-'+String(n).padStart(2,'0'), key: k, seq: n };
  },
  reserve(k, seq){
    /* v1.0.13：写前再兜底一次。used 若因任何原因不是普通对象（被外部代码
       换成数组 / 置为 null），先在原地复位，避免 `this.used[k]=...` 静默失效
       → 编号流水停滞 → 同一天反复给出 -01，撞号且无从察觉。 */
    if (!this.used || typeof this.used !== 'object' || Array.isArray(this.used)) this.used = {};
    this.used[k] = Math.max(this.used[k]||0, seq);
    lsSet('sw_usedno', JSON.stringify(this.used));
  },
  release(k, seq){
    /* 只回退「当前最大且为末位」的情况，避免撞号 */
    if(this.used[k]===seq){ delete this.used[k];

  },
  preview(baseDate){
    const x = this.next(baseDate);
    return '下一个可用：' + x.no + '（' + x.key + ' 当日已用 '
      + (this.used[x.key]||0) + ' 份）';
  }
};
const LS='sw_doc_v01';
const REQ = v => !String(v??'').trim();

/* ==========================================================================

   --------------------------------------------------------------------------
   为什么需要：localStorage 是**整个 origin 共享 4 MB**（实测，非每键 4 MB），
   而图片压到 1600px/q0.85 后单张仍可达 1.1 MB。§4 场地参考图 10 张 +

   所以危险的不是「数据全丢」，而是：

const CAP_WARN = 0.75;   /* 占用达 75% 起黄条，90% 起红条并禁用继续加图 */
const CAP_BLOCK= 0.90;
/* 探底真实配额：二分不划算（每次探测都要写 MB 级数据），
   实测 Chromium file:// 与 http:// 均为 4 MB，故直接取保守值。 */
const CAP_TOTAL = 4 * 1024 * 1024;

let _capLocked = false;   /* 已因超限锁定，避免每次输入都弹窗刷屏 */

/* 统计当前文档里所有 data: 图片的累计体积（精确到字节，遍历代价可接受） */
function imgBytes(){
  let n = 0, total = 0;
  (function walk(x){
    if (typeof x === 'string'){ if (x.startsWith('data:')){ n++; total += x.length; } return; }
    if (Array.isArray(x)){ x.forEach(walk); return; }
    if (x && typeof x === 'object'){ for (const k in x) walk(x[k]); }
  })(D);
  return { n, total };
}
/* 占用率 = 本文档实际字节 / 配额。返回 {used, total, ratio, imgN} */
function storageStat(){
  let used = 0;
  try{ used = (localStorage.getItem(LS) || '').length; }catch(e){}
  const im = imgBytes();
  return { used, total: CAP_TOTAL, ratio: used / CAP_TOTAL, imgN: im.n };
}
const kb = n => (n / 1024).toFixed(0);

/* 核心：所有写入都从这里过。返回 true=存成功，false=未存（已告警） */
function save(){
  const json = JSON.stringify(D);
  try{
    localStorage.setItem(LS, json);
  }catch(err){
    /* 关键：此时磁盘上仍是上一次成功的内容，D 里的新数据**从未落库**。
       必须明确告知，且不能只提示一次——用户可能几分钟后才刷新页面。 */
    if (!_capLocked){
      _capLocked = true;
      const im = imgBytes();
      toast('⚠️ 存储已满，本次修改未保存\n\n'
        +'当前占用 ' + kb(json.length) + ' KB / 上限 ' + kb(CAP_TOTAL) + ' KB\n'
        +'图片 ' + im.n + ' 张，占 ' + kb(im.total) + ' KB（占 ' 
        + Math.round(im.total / json.length * 100) + '%）\n\n'
        +'你屏幕上看到的新内容**尚未写入**，刷新会丢失。\n'
        +'请立即「导出整案」备份，然后删掉部分参考图 / 样片再继续。');
    }
    if (window.__capBar) window.__capBar();
    return false;
  }
  _capLocked = false;
  if (window.__capBar) window.__capBar();
  return true;
}

/* ==========================================================================
   图片压缩 → dataURL（v1.1 改为自适应体积控制）
   --------------------------------------------------------------------------
   为什么改：原实现固定「长边 1600px + q0.85」，实测单张仍可达 1.1 MB
   （1600×1067 噪声图，是最难压的情况）。而整个 origin 的localStorage
   只有 4 MB——十几张图就触顶，触顶后新内容静默存不进去。
   所以目标从「压到固定尺寸」改为「**压到指定体积以内**」。

   策略（顺序有讲究）：
     ① 先把长边压到 1400px（够印刷看构图，再大纯属浪费）
     ② 仍超标 → 逐级降 JPEG 质量（0.72→0.36），画质肉眼几乎无差
     ③ 还超标 → 降分辨率（每轮 ×0.8，最低 900px），因为 JPEG 有体积地板，
        噪声图再怎么降质量也压不下去，只能缩像素
   典型人像/风景在 ①② 就收敛了，只有极端噪声图才会走到③。
   ========================================================================== */
const IMG_TARGET_KB = 160;      /* 单图目标上限。4MB / 160KB ≈ 25 张，够用 */
const IMG_MAX_EDGE  = 1400;
const IMG_MIN_EDGE  = 900;

async function shrink(file, max=IMG_MAX_EDGE, q=.85, targetKB=IMG_TARGET_KB){
  const bmp = await createImageBitmap(file);
  const {width:ow, height:oh} = bmp;
  const fit = m=>{ const sc=Math.min(1, m/Math.max(ow,oh));
    return [Math.max(1,Math.round(ow*sc)), Math.max(1,Math.round(oh*sc))]; };
  const enc = (w,h,qq)=>{
    const c=document.createElement('canvas'); c.width=w; c.height=h;
    c.getContext('2d').drawImage(bmp,0,0,w,h);
    return c.toDataURL('image/jpeg',qq);
  };
  const bytes = u => u.length * .75;          /* base64 → 原始字节近似 */

  let [w,h] = fit(max);
  let url = enc(w,h,q);

  /* ② 逐级降质量：到此为止画质基本无损，是性价比最高的一段 */
  if(bytes(url)/1024 > targetKB){
    for(const qq of [.72,.62,.52,.44,.36]){
      url = enc(w,h,qq);
      if(bytes(url)/1024 <= targetKB) break;
    }
  }
  /* ③ 仍超标 → 降分辨率（JPEG 体积地板效应，噪声图只能走这条） */
  let guard = 0;
  while(bytes(url)/1024 > targetKB && Math.max(w,h) > IMG_MIN_EDGE && guard++ < 4){
    const [nw,nh] = fit(Math.round(Math.max(w,h)*.8));
    w=nw; h=nh; url = enc(w,h,.5);
  }
  return {url, w, h, size:Math.round(bytes(url)),
          over: bytes(url)/1024 > targetKB};
}
async function hash(s){
  const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));
  return [...new Uint8Array(b)].slice(0,8).map(x=>x.toString(16).padStart(2,'0')).join('');
}

function pickHTML(id,val){

async function setPick(id,file){
  if(!file||!file.type.startsWith('image/')){ toast('请选择图片文件'); return; }
  const r=await shrink(file);
  ASSETS[id]={mime:'image/jpeg',w:r.w,h:r.h,size:r.size,uploadedAt:new Date().toISOString()};
  setByPath(id,r.url);
  /* 存盘失败必须让用户知道——这次修改没进存储，刷新就没了 */
  if(!save()) return;
  render();
  toast('图片已嵌入（'+Math.max(r.w,r.h)+'px · '
    +Math.round(r.size/1024)+' KB）'
    +(r.over?'\n⚠️ 已尽力压缩，仍偏大，请留意顶栏存储占用':''));
}
/* v1.5：把图片写入「数组字段」的指定槽位。
   区别于 setPick()——后者是标量字段（整字段只有一张图，替换即可）。
   数组字段（如 §1 模特样图 1-2 张、§11 参考样片 5-25 张）需要：
   ① 按 id 末段的索引定位；② 越界时追加而非替换；③ 容量上限校验。
   idx 为 null时表示「追加到末尾」。 */
async function setPickArr(key,arr,idx,file,max){
  if(!file||!file.type.startsWith('image/')){ toast('请选择图片文件'); return false; }
  if(arr.length>=max && (idx===null||idx>=arr.length)){
    toast('最多 '+max+' 张，已达上限'); return false; }
  const r=await shrink(file);
  ASSETS[key+(idx===null?arr.length:idx)]={mime:'image/jpeg',w:r.w,h:r.h,size:r.size,
    uploadedAt:new Date().toISOString()};
  if(idx===null||idx>=arr.length) arr.push(r.url); else arr[idx]=r.url;
  return true;
}

/* 路径格式：
   len2 "0.编号" / "4.名称" / "7.图" / "10.人" → 标量
   len3 "3.妆.风" / "3.发.图"                 → §3 两个对象
   len4 "2.服装.0.款" / "7.灯位.0.具" / "10.风.0.触" → 行数组 */
function rowArr(sec,a){
  if(sec==='2')  return a==='配饰'?D.s2.配饰[0]:D.s2.服装;
  if(sec==='7') return D.s7.灯位[0];
  if(sec==='10') return D.s10.风[0];
  if(sec==='5')  return D.s5.道具;     /* v1.5 §5 道具清单 */
  if(sec==='6')  return D.s6[a]||null;  /* v1.5 §6 器材/滤镜/灯/附件 四子表 */
  if(sec==='8')  return D.s8.行||null;     /* v1.6 §7 timetable 行数组 */
  return null;
}
function boxOf(sec){
  return sec==='0'?D.s0 : sec==='1'?D.s1 : sec==='4'?D.s4
       : sec==='5'?D.s5 : sec==='6'?D.s6 : sec==='11'?D.s11   /* v1.5 新增 §5/§6/§11 */
       : sec==='8'?D.s8                                          /* v1.6 新增 §7 行程 */
       : sec==='7'?D.s7 : sec==='10'?D.s10 : null;
}
function setByPath(path,val){
  const p=path.split('.');
  if(p.length===4){ const arr=rowArr(p[0],p[1]); if(arr) arr[+p[2]][p[3]]=val; return; }
  if(p.length===3){ (p[1]==='发'?D.s3.发:D.s3.妆)[p[2]]=val; return; }
  const b=boxOf(p[0]); if(b) b[p[1]]=val;
}
function getByPath(path){
  const p=path.split('.');
  if(p.length===4){ const arr=rowArr(p[0],p[1]); return arr?arr[+p[2]][p[3]]:''; }
  if(p.length===3) return (p[1]==='发'?D.s3.发:D.s3.妆)[p[2]];
  const b=boxOf(p[0]); return b?b[p[1]]:'';
}

/* ==========================================================================
   4b. §0 ↔ §1 / §4 双向同步（v1.7）
   --------------------------------------------------------------------------
   背景：第四批需求把 §0.3 / §0.7 的「从库选择」下拉下线了，改为两处各自手填，
   结果同一份数据（模特姓名、场地名称）出现两处、互不同步——用户抱怨
   「0.7 模特姓名应该要和 1.1 同步」「0.3 拍摄地点要和模块 4 同步」。

   口径（用户拍板）：**双向同步，以档案侧为主**。
     · §1 档案改→ §0.7 立即刷新（档案是主数据源）
     · §0.7 改   → 反写 §1 档案（并同步模特库中的同名记录）
     · §4 档案改→ §0.3 立即刷新
     · §0.3 改   → 反写 §4 档案
   实现要点：
     · 只做「值级」同步，不做整节render()——否则输入框会失焦
     · 用 syncPeer() 统一写 DOM，避免各处各写一套
     · 反写档案时不回灌（避免 A→B→A 死循环），故设 suppress 标志
   ========================================================================== */
let _syncing=false;   /* 抑制标志：同步写DOM 时不再触发反向同步 */
function setPeer(path,val){
  const el=document.querySelector('[data-p="'+path+'"]');
  if(!el||el.value===val) return false;
  _syncing=true; el.value=val; _syncing=false;
  syncMiss(el);
  return true;
}
/* 模特档案 → §0.7 摘要卡（**单向**）
   v1.0.10 变更：本函数原先是双向的（§0.7 → §1 反写），
   随「§0.7 姓名输入框下线」改为单向 —— 模特资料只有 §1.1 一处可编辑，
   避免两处可编辑框互相覆盖导致数据打架。
   D.s0.模特 作为派生字段保留（导出 / CSV 仍在读它），由这里单向写入。 */
function syncModelDown(){
  D.s0.模特 = D.s1.姓名||'';
}
/* 场地档案 → §0.3 拍摄地点 */
function syncVenueDown(){

  D.s0.场地所在区 = D.s4.所在区||'';

/* §0.3 → §4 档案（反写） */
function syncVenueUp(){
  D.s4.名称   = D.s0.地点||'';
  D.s4.所在区 = D.s0.场地所在区||'';
  setPeer('4.名称', D.s4.名称);
  setPeer('4.所在区', D.s4.所在区);
  /* 若已绑定场地库记录（D.s4.场地Id 非空），同步库里的名称 */
  const id=D.s4.场地Id;
  if(id){
    const i=VENUES.findIndex(x=>x.id===id);
    if(i>=0){
      const nv=VENUES[i].名称, nr=VENUES[i].所在区;
      VENUES[i].名称=D.s4.名称;
      VENUES[i].所在区=D.s4.所在区;
      if(nv!==VENUES[i].名称||nr!==VENUES[i].所在区){
        VENUES[i].updatedAt=new Date().toISOString();
        saveVenues();
      }
    }
  }
}
/* §7 表格 → 甘特图联动：改动「开始/耗时」后立刻重绘甘特条与结束时间。
   注意用 render() 而非局部改 DOM：时间轴范围可能变化（如把第一项提前 2 小时），
   刻度、关键节点位置都要跟着变，整段重渲染最稳。 */
function dispatchSync(path){
  if(_syncing) return;
  /* §7：结束时间字段由「开始 + 耗时」派生，不接受直接输入 */
  if(/^7\.行\.\d+\.止$/.test(path)){
    const m=path.match(/^7\.行\.(\d+)\.止$/);
    const r=D.s8.行[+m[1]];
    const st=t2m(r&&r.时);
    setByPath(path, (st!=null&&+r.耗时)? m2t(st+ +r.耗时):'');
    save(); render(); return;
  }
  if(/^7\.行\.\d+\.(时|耗时|事)$/.test(path)){ render(); return; }
  if(path==='1.姓名')            { syncModelDown(); patchCards(); }
  else if(path==='4.名称'||path==='4.所在区'){ syncVenueDown(); patchCards(); }
  else if(path==='0.地点'||path==='0.场地所在区'){ syncVenueUp(); patchCards(); }
  /* §1 其他字段（身高/体重/备注/样图数）变化 → §0.7 摘要卡跟着变 */
  else if(/^1\.(身高|体重|备注)$/.test(path)){ patchCards(); }
}

/* ==========================================================================
   6. 渲染
   ========================================================================== */
function fld(label,val,path,opt={}){
  const miss=opt.req&&REQ(val);
  let ctl;
  if(opt.type==='select')
    ctl=`<select data-p="${path}" data-req="${opt.req?1:0}" class="${miss?'err':''}">
      <option value="">— 请选择 —</option>
      ${(opt.opts||[]).map(o=>`<option ${o===val?'selected':''}>${esc(o)}</option>`).join('')}</select>`;
  else if(opt.type==='textarea')
    ctl=`<textarea data-p="${path}" data-req="${opt.req?1:0}" class="${miss?'err':''}"
      placeholder="${esc(opt.ph||'')}">${esc(val)}</textarea>`;
  else
    ctl=`<input type="${opt.type||'text'}" data-p="${path}" data-req="${opt.req?1:0}"
      value="${esc(val)}"
      class="${miss?'err':''}" placeholder="${esc(opt.ph||'')}">`;
  return `<div class="f">
    <label>${label}${opt.req?'<span class="req" title="强制项">*</span>':''}${
      opt.rec?'<span class="rec">推荐</span>':''}</label>
    ${ctl}
    ${miss?`<div class="miss">⚠ 强制项未填</div>`:''}
    ${opt.hint?`<div class="hint">${esc(opt.hint)}</div>`:''}
  </div>`;
}
/* 强制项红框 + 「⚠ 强制项未填」提示的<b>双向</b>同步：
   填上→ 撤红框与提示；删空 → 恢复红框与提示。
   两者是独立节点（.err 在控件上、.miss 是同级 div），必须成对处理，
   只撤 class 会让文字提示留在页面上误导决策。 */
function syncMiss(el){
  if(!el.dataset.req) return;          // 非强制项字段不参与
  const box=el.closest('.f'); if(!box) return;
  const empty=REQ(el.value);
  el.classList.toggle('err', empty);
  const m=box.querySelector('.miss');
  if(empty && !m) box.insertBefore(
    Object.assign(document.createElement('div'),{className:'miss',textContent:'⚠ 强制项未填'}),
    box.querySelector('.hint')||null);
  else if(!empty && m) m.remove();
}
function ck(label,on,path){
  return `<label class="ck"><input type="checkbox" data-p="${path}" ${on?'checked':''}>
    <span>${label}</span></label>`;
}
/* 章节标题栏。
   v1.0.2：移除「原型做实 / 占位」徽标——那是开发阶段的内部标记，
   对使用者无意义；且12 章节已全部做实，该徽标恒为「做实」，
   留着反而像在提示"还有功能没做完"。
   同时移除 core 参数（原本只用于决定该徽标的文案），签名简化为 (n, t, req)。
   保留「含强制项」徽标：它有真实信息量——告诉用户本节有拦截导出的必填校验。 */
function secHead(n,t,req){
  return `<div class="sec-h"><span class="sec-n">${n}</span><h2>${t}</h2>
    ${req?'<span class="badge b-rec">含强制项</span>':''}</div>`;
}
function phBox(n,t,fields){
  return `<div class="ph-box"><b>${n} ${t} · 待实现</b>

}

/* ==========================================================================
   §8 行程安排（v1.6 做实 · v1.7 甘特图可拖拽）
   --------------------------------------------------------------------------
   口径确认：只做 timetable 管理模型，**不做人员分工**。
     7.1 甘特图 —— 每行一个可拖拽色块；整块拖=改开始时间，边缘拖=改时长；
                    与 7.2 表格双向实时同步（用户拍板：拖拽 + 表格输入框联动）
     7.2 timetable 表 —— 开始 / 结束 / 事项 / 地点 / 耗时 / 备注，可增删行
     7.3 汇总校验 —— 自动累计耗时，与 §0.2「预计时长」比对，超时给提醒
   关键节点（黄金时刻 / 日落）作为整列参考标记画在甘特图背景上。
   ========================================================================== */
/* 把 HH:MM 转成分钟，便于在甘特图上换算位置 */
function t2m(t){
  const x=String(t||'').match(/^(\d{1,2}):(\d{2})$/);
  return x? (+x[1])*60+(+x[2]) : null;
}
/* 分钟 → HH:MM（越界不wrap，超出 24:00 显示 24:00 便于发现排到天亮） */
function m2t(m){
  m=Math.max(0,Math.round(m));
  return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');
}
/* 拖拽吸附粒度：15 分钟（拍摄排期按刻钟走，太细反而难对齐现实节点） */
const SNAP=15;
const snap=m=>Math.round(m/SNAP)*SNAP;
/* 事项 → 色值：按关键词归类，让甘特图一眼看出「妆造/拍摄/收尾」阶段 */
/* 阶段配色：① 先按 slotSet() 的节点名精确命中（「黄金时刻」「日落」等）
   ② 再按关键词兜底。「逆光拍摄」这类应归shoot，所以精确名优先级高于关键词。 */
const S8_SEG=[
 [/妆|化妆|定妆|换装|服装|备装/,   'prep',  '#7d8a76'],
 [/布光|架灯|测光|灯位|调试/,       'setup', '#8a8467'],
 [/日落|蓝调|黄昏/,                 'sunset','#a05a4a'],
 [/黄金|逆光|剪影|氛围/,            'golden','#b8863f'],
 [/收工|收拾|归还|撤场|收尾/,       'wrap',  '#6f7d8a'],
 [/拍摄|正片|快门|拍$/,            'shoot', '#8a7b68']
];
/* v1.9 需求4：取某个时段节点在 8.2 表格里的实际开始时间。
   匹配口径与点击联动一致——事项名与节点名**完全相同**才算联动，
   避免「逆光组拍摄」这类模糊匹配把节点时刻拽偏。 */
/* v1.0.11：节点名兼容匹配。
   为什么需要：v1.0.11 把「黄金时刻 / 日落」改名为
   「上午黄金时刻 / 上午蓝调时刻 / 下午黄金时刻 / 下午蓝调时刻」，
   而 slotRowIndex 原本是**精确名**比对。老策划案（v1.0.10 及以前）
   的 §8.2 里存的仍是「黄金时刻」「日落」，改名后一比就miss，
   联动会静默失效——用户在表格里填的时间不再反映到轴上，
   且没有任何报错提示，属于典型的「升级即退化」。
   对策：精确名优先 → 历史别名 → 基名（去掉上午/下午前缀）唯一命中。
   基名唯一性校验是必要的：若表格里同时有「上午黄金时刻」和
   「下午黄金时刻」两行（全天拍摄），不应由任一侧节点去认领。 */
const SLOT_ALIAS={'日落':'蓝调时刻','黄昏':'蓝调时刻'};
function slotBaseName(k){
  let s=String(k||'').trim();
  if(SLOT_ALIAS[s]) s=SLOT_ALIAS[s];
  return s.replace(/^(上午|下午)/,'').trim();
}
function slotRowIndex(k){
  const rows=D.s8.行||[], t=String(k||'').trim();
  let i=rows.findIndex(r=>String(r.事||'').trim()===t);
  if(i>=0) return i;
  const base=slotBaseName(t);
  if(!base) return -1;
  const cand=rows.filter(r=>slotBaseName(r.事)===base);
  return cand.length===1 ? rows.indexOf(cand[0]) : -1;
}
function slotActual(k){
  const i=slotRowIndex(k);
  if(i<0) return null;
  const m=t2m((D.s8.行||[])[i].时);
  return m==null?null:m2t(m);
}
/* v1.9：轴上被 8.2 联动命中的节点集合，渲染表格时用来打标记 */
function slotLinkedSet(){
  return new Set(slotSet().filter(s=>slotActual(s.k)!=null).map(s=>s.k));
}
function segOf(s){
  const t=String(s||'').trim();
  if(!t) return {seg:'shoot', c:'#8a7b68'};
  /* ① 精确名：与 §8.1 关键节点同名 → 用节点配色，保证图例与节点标签一致 */
  const hit=slotSet().find(x=>x.k===t);
  if(hit) return {seg:hit.seg, c:hit.c};
  /* ①b v1.0.11：基名匹配。老策划案表格里写的是「黄金时刻」「日落」，
        与改过名的节点对不上，靠这里保住节点配色不退回通用拍摄色。 */
  const bh=slotSet().find(x=>slotBaseName(x.k)===slotBaseName(t));
  if(bh) return {seg:bh.seg, c:bh.c};
  /* ② 关键词兜底 */
  for(const[re,seg,c] of S8_SEG) if(re.test(t)) return {seg,c};
  return {seg:'shoot', c:'#8a7b68'};
}
/* v1.9：把 8.2 的某一行滚动到视野内并闪一下，让「联动」有即时视觉反馈。 */
function flashRow(i){
  const tr=document.querySelector('[data-slotrow="'+i+'"]')
    || [...document.querySelectorAll('#sec-8 tbody tr')][i];
  if(!tr) return;
  tr.classList.add('flash');
  tr.scrollIntoView({block:'center'});
  setTimeout(()=>tr.classList.remove('flash'),1400);
}
/* v1.9 需求4：局部重绘 §8。
   为什么不能直接 render()：用户在 8.2 表格里正打着字，render() 会重建
   #main 整棵子树，正在编辑的 input 被销毁 → 失焦 / 光标跳到开头 / 中文输入法断。
   做法：只替换甘特容器（8.1）与表格里的派生列（结束时间、阶段色、联动标记），
        表格 input 本身**不重建**，只改 value —— 焦点与光标都保住。 */
function repaintGantt(){
  const sec=document.getElementById('sec-8');
  if(!sec) return;
  const arr=D.s8.行||[], plan=+D.s0.时长||0;

  /* --- 8.1 甘特图：整块换掉（这里没有正在编辑的控件） --- */
  const old=sec.querySelector('.gt'); const box=document.createElement('div');
  box.innerHTML=gtBlock();
  const fresh=box.firstElementChild;
  if(old&&fresh) old.replaceWith(fresh);

  /* --- 8.1 v1.0.11：光影时刻覆盖区也要跟着重画。
     为什么单独处理：拍摄时段（§0.2）或拍摄日期（§0.2）变化时，
     甘特轴上四个光影节点的**时刻与名称**都变（上午黄金 ↔ 下午黄金）。
     但 §0.2 在页面顶部，用户改的是那边的 select，不能整页 render()——
     那会销毁 §8 表格里正在编辑的 input。所以只换这两个块。--- */
  const oldS=sec.querySelector('.solarbox');
  if(oldS){
    const tb=document.createElement('div'); tb.innerHTML=solarOvrHtml();
    const fs=tb.firstElementChild;
    if(fs) oldS.replaceWith(fs);
  }

  /* --- 8.1 v1.0.11：图例也要跟着重画。
     为什么容易漏：图例是 .gt 的**兄弟节点**（在 gtBlock() 之外），
     上面那次 .gt.replaceWith 换不掉它。不补这一句的话，
     §0.2 从「下午」切到「上午」，轴上节点已变成「上午黄金时刻」，
     下方图例却还写着「下午黄金时刻 / 下午蓝调时刻」——自相矛盾。--- */
  const oldL=sec.querySelector('[data-slot-legend]');
  if(oldL) oldL.innerHTML=slotLegend();

  /* --- 8.2 表格：只改派生列，不动 input --- */
  const rows=sec.querySelectorAll('tbody tr');
  arr.forEach((r,i)=>{
    const tr=rows[i]; if(!tr) return;
    const m=t2m(r.时), d=+r.耗时||0;
    /* 结束时间（只读派生） */
    const endEl=tr.querySelector('[data-p$=".止"]');
    if(endEl){
      const {T1}=gtRange();
      endEl.value=(m!=null&&d)?m2t(m+d):'';
      endEl.style.color=(m!=null&&d&&m+d>T1)?'var(--amber)':'var(--text2)';
    }
    /* 阶段色条 + 事项联动标记 */
    const wrap=tr.querySelector('[data-p$=".事"]')?.parentElement;
    if(wrap){
      const {c}=segOf(r.事);
      const bar=wrap.querySelector('span[title^="阶段色"]');
      if(bar) bar.style.background=c;
      const linked=slotRowIndex(String(r.事||'').trim())===i;
      tr.classList.toggle('gt-linked',linked);
      let mark=tr.querySelector('.lnk-mark');
      if(linked){
        if(!mark){ mark=document.createElement('span');
          mark.className='lnk-mark'; wrap.appendChild(mark); }
        mark.textContent='◆ 轴联动'+r.时;
      } else if(mark) mark.remove();
    }
  });

  /* --- 8.3 耗时汇总 --- */
  const total=arr.reduce((s,r)=>s+(+r.耗时||0),0);
  const cells=sec.querySelectorAll('.f div[style*="tabular-nums"], #anc-8-3 ~ .grid .f');
  if(cells.length){
    const box2=cells[0];
    const b=document.createElement('div');
    b.style.cssText='padding:9px 0;font-family:var(--fm);font-size:16px;font-weight:600;color:var(--accent)';
    b.innerHTML=total+' 分钟<span style="font-size:12px;color:var(--text3);font-weight:400">'
      +' （'+(total/60).toFixed(1)+' 小时）</span>';
    box2.replaceWith(b);
  }
}
/* 时间轴范围：以所有事项的最早开始 / 最晚结束为准，两端各留1 小时并对齐整点；
   无有效时间时退回 08:00–20:00；最小跨度 6 小时。 */
function gtRange(){
  const arr=D.s8.行||[];
  let lo=Infinity, hi=-Infinity;
  arr.forEach(r=>{
    const m=t2m(r.时); if(m==null) return;
    lo=Math.min(lo,m);
    hi=Math.max(hi,m+(+r.耗时||0));
  });
  if(!isFinite(lo)){ lo=8*60; hi=20*60; }
  /* v1.0.11：把当前时段对应的光影节点也纳入范围。
     起因：只按行程行算时，最早一行通常是妆造 08:30 → T0=07:00，
     而「上午黄金 06:37 / 上午蓝调 06:28」落在 T0 之前，
     被 gtBlock 的 m<T0 过滤掉 —— 结果「选上午却看不到上午那组光影」，
     恰好废掉了本需求的核心场景。
     只扩不缩：绝不能因为多了两个节点就把本来合适的轴拉宽。 */
  try{
    slotSet().forEach(sl=>{
      if(!/黄金时刻|蓝调时刻/.test(sl.k)) return;   /* 只看光影节点，流程节点不动轴 */
      const m=t2m(sl.t); if(m==null) return;
      lo=Math.min(lo,m); hi=Math.max(hi,m+30);      /* 蓝调/黄金按 30 分钟窗算右界 */
    });
  }catch(e){ /* slotSet 在 TDZ 时静默降级为「只看行程行」 */ }
  let T0=Math.floor((lo-60)/60)*60;
  let T1=Math.ceil((hi+60)/60)*60;
  while(T1-T0<360) T1+=60;
  return {T0,T1,span:T1-T0};
}
/* v1.9 需求4：甘特图抽成独立函数，供 sec7() 首绘与 repaintGantt() 增量重绘共用。
   之前这段是内联在 sec7() 里的，repaintGantt 拿不到，只能整页 render —— 表格输入会失焦。 */
/* v1.9 需求4：甘特图抽成独立函数，供 sec7() 首绘与 repaintGantt() 增量重绘共用。
   之前这段内联在 sec7() 里，repaintGantt 拿不到，只能整页 render() ——
   而用户正在 8.2 表格里打字，整页重建会销毁 input 导致失焦 / 光标跳走 /输入法断。
   现在 render 与增量重绘走同一条生成逻辑，两处永远不会画出不同的图。 */
/* v1.0.11：图例文案动态生成。
   此前是手写死的「妆造/布光/拍摄/黄金时刻/日落/收工」，
   节点改名（黄金时刻→上午/下午黄金时刻、日落→上午/下午蓝调时刻）后
   图例与实际节点对不上。改为从 slotSet() 生成，永远一致。 */
function slotLegend(){
  const ks=slotSet().map(s=>s.k);
  return '灰色竖条为<b>关键节点参考线</b>（'+ks.join(' / ')
    +'），典型值仅供参考；<b>冬季日落早约 1 小时</b>，'
    +'逆光剪影、氛围片都靠黄金与蓝调这两段。';
}
/* 甘特图容器的可用像素宽度（去掉滚动条余量），供标签防重叠换算 */
function gtHostW(){
  const el=document.querySelector('.gt');
  return el ? Math.max(280, el.clientWidth-14) : 900;
}
function gtBlock(){
  const arr=D.s8.行;
  const {T0,T1,span}=gtRange();
  const pct=m=>Math.max(0,Math.min(100,(m-T0)/span*100));
  /* 刻度：跨度 <= 9 小时按 1 小时一格，否则 2 小时一格 */
  const step=span<=540?60:120;
  let ticks='';
  for(let m=T0;m<=T1;m+=step)
    ticks+=`<div class="gt-tick${m%120===0?' major':''}" style="left:${pct(m)}%">${m2t(m)}</div>`;
  /* 关键节点背景标记（整列高亮 + 顶部可点标签）
     v1.9 需求4：节点时刻改为**跟随 8.2 timetable 的实际行**，而非固定常量——
     用户把「黄金时刻」改到 17:20，轴上标签同步显示 17:20，两处不再打架。
     没有对应行时才回落到 slotSet() 的典型值，并标「参考」以示区分。 */
  /* v1.0.11：节点标签防重叠。
     上午档时轴范围被拉到 05:00–19:00，五个标签全挤在 06:28–08:30 之间，
     文字互相压盖糊成一团。做法：按 x 顺序遍历，与上一个标签的右边界
     间距不足就往下让一行（标签绝对定位，天然可错位），并画一条细引线
     回到真实时刻—— 错位不丢准确性。 */
  const LABW=78;/* 标签近似宽度(px)，用于估算占位 */
  let lastRight=-1e9, lastLine=0;
  const slots=slotSet().map(sl=>{
    /* v1.0.11 修既有缺陷：时刻必须在**一处**决定，绘图与标签文字共用。
       原来绘图用 slotTime||sl.t（正确），标签却直接用 slotTime，
       未与 8.2 联动时它是 null → 标签只显示节点名、缺时刻，
       而背景块画在正确位置 —— 「块对字缺」，肉眼极易放过。 */
    const linked=slotActual(sl.k)!=null;
    const label =slotActual(sl.k) || sl.t;   /* 实际时刻，未联动则用典型值 */
    const m=t2m(label);
    if(m==null||m<T0||m>T1) return '';
    const w=Math.max(0,pct(m+60)-pct(m));
    /* 防重叠：估算该标签的像素左界，与上一个比较；不够就让到下一行 */
    const hostW=gtHostW();
    const px=pct(m)/100*hostW;
    let line=0;
    if(lastRight>-1e8 && px<lastRight+6) line=lastLine+1;
    lastRight=px+LABW; lastLine=line;
    const lead=line
      ? `<span class="gt-slotlab-lead" style="left:calc(${pct(m)}% + 2px);height:${line*14}px"></span>`
      : '';
    return `<div class="gt-slot" style="left:${pct(m)}%;width:${w}%;--c:${sl.c}"></div>`+lead
      +`<button class="gt-slotlab${linked?' linked':''}" data-slot="${esc(sl.k)}"
         style="left:calc(${pct(m)}% + 3px);top:${line*14}px;--c:${sl.c}"
         title="${esc(sl.k+' '+label+'（'+(linked?'已与 8.2 联动':'典型参考值，未在 8.2 排入')+'）'
           +'\n'+sl.tip+'\n\n点击：已排则定位到 8.2 对应行 / 未排则新增该阶段')}">`
        +`\u2605 ${esc(sl.k)} ${esc(label)}${linked?'':'<i class="ref">参考</i>'}</button>`;
  }).join('');
  /* 甘特条：整块拖 = 改开始；左右边缘 = 改时长 */
  const bars=arr.map((r,i)=>{
    const m=t2m(r.时); const dur=+r.耗时||0;
    const{seg,c}=segOf(r.事);
    if(m==null) return `<div class="gt-row"><div class="gt-bar"
      style="left:0;width:100%;--c:var(--text3);opacity:.55"
      title="未填开始时间——请在下方 8.2 填写">未填开始时间</div></div>`;
    return `<div class="gt-row" data-gti="${i}">
      <div class="gt-bar${pct(m+dur)-pct(m)<7?' slim':''}"
        data-gti="${i}" data-seg="${seg}"
        style="left:${pct(m)}%;width:${Math.max(1.2,pct(m+dur)-pct(m))}%;--c:${c}"
        title="${esc(r.事||'未填事项')} \u00b7 ${esc(r.时)} 起${dur? dur+' 分钟（至 '+m2t(m+dur)+'）':''}">
        <div class="gt-h l" data-gth="l"></div>
        <span class="gt-t">${esc(r.事||'未填事项')}</span>
        <span class="gt-d">${dur?dur+'m':''}</span>
        <div class="gt-h r" data-gth="r"></div>
      </div></div>`;
  }).join('');
  return `<div class="gt"><div class="gt-inner">
    <div class="gt-head">${ticks}
      <div class="gt-slotrow">${slots}</div>
    </div>
    <div class="gt-guide" id="gtGuide"></div>
    <div class="gt-rows">${bars}</div>
  </div></div>`;
}

/* ==========================================================================
   §7 甘特图拖拽引擎（v1.7）
   --------------------------------------------------------------------------
   三种拖拽模式：
     move整块 → 改开始时间（吸附 SNAP 分钟）
     l左边缘 → 改开始时间并保持结束时间不变（= 加时长）
     r     右边缘 → 保持开始不变，只改时长
   关键约束：
     · 拖拽过程中**不重渲染**，只改DOM —— 重渲染会让元素被销毁、
       pointermove 丢失 capture，出现「拖一半就断」的经典卡死。
     · 松手才写回 D 并 render()，保证数据层与画面一致。
     · 拖拽时间轴范围可能变化（如把最后一项往后拖），故拖拽中用**临时范围**
       实时重算位置；松手后再按新数据重新渲染。
   ========================================================================== */
let gtDrag=null;
function gtPxPerMin(){
  const inner=document.querySelector('.gt-inner');
  if(!inner) return 0;
  return inner.getBoundingClientRect().width/gtRange().span;
}
/* 拖拽中重排所有甘特条：用临时数据算出新范围，视觉上立刻跟随手指 */
function gtPaintLive(){
  const inner=document.querySelector('.gt-inner');
  if(!inner||!gtDrag) return;
  const {T0,span}=gtDrag.range;
  const pct=m=>Math.max(0,Math.min(100,(m-T0)/span*100));
  document.querySelectorAll('.gt-bar[data-gti]').forEach(bar=>{
    const i=+bar.dataset.gti, r=gtDrag.rows[i];
    if(!r) return;
    const m=t2m(r.时); const d=+r.耗时||0;
    if(m==null){
      bar.style.left='0%'; bar.style.width='100%'; return; }
    const w=Math.max(1.2,pct(m+d)-pct(m));
    bar.style.left=pct(m)+'%';
    bar.style.width=w+'%';
    bar.classList.toggle('slim', w<7);
    const t=bar.querySelector('.gt-t'), dd=bar.querySelector('.gt-d');
    if(t) t.textContent=r.事||'未填事项';
    if(dd) dd.textContent=d?d+'m':'';
    bar.title=(r.事||'未填事项')+' · '+r.时+' 起'+(d? d+' 分钟（至 '+m2t(m+d)+'）':'');
  });
  /* 顶部刻度同步平移，保证「现在」线与刻度仍对得上 */
  const guide=document.getElementById('gtGuide');
  if(guide){
    const nm=new Date(); const nowM=nm.getHours()*60+nm.getMinutes();
    if(nowM>=T0&&nowM<=T0+span){ guide.style.display='block';
      guide.style.left=pct(nowM)+'%'; }
    else guide.style.display='none';
  }
}
/* 拖拽中时间轴可能撑大，重算范围（保留至少原有宽度，避免越拖越窄） */
function gtRecalcRange(rows){
  let lo=Infinity,hi=-Infinity;
  rows.forEach(r=>{ const m=t2m(r.时); if(m==null)return;
    lo=Math.min(lo,m); hi=Math.max(hi,m+(+r.耗时||0)); });
  if(!isFinite(lo)){ lo=8*60; hi=20*60; }
  let T0=Math.floor((lo-60)/60)*60, T1=Math.ceil((hi+60)/60)*60;
  while(T1-T0<360) T1+=60;
  /* 不允许比原始范围更窄，否则往回拖会被边界卡住 */
  return {T0,T1,span:T1-T0};
}
document.addEventListener('pointerdown',e=>{
  const h=e.target.closest('[data-gth]');
  const bar=e.target.closest('.gt-bar[data-gti]');
  if(!bar) return;
  const mode=h?h.dataset.gth:'move';
  const i=+bar.dataset.gti;
  const r=(D.s8.行||[])[i]; if(!r) return;
  const m=t2m(r.时);
  if(m==null){ toast('这一行还没填开始时间——请先在下方 7.2 填写'); return; }
  const px=gtPxPerMin(); if(!px) return;
  e.preventDefault();
  bar.setPointerCapture&&bar.setPointerCapture(e.pointerId);
  bar.classList.add('dragging');
  gtDrag={i,mode,px,x0:e.clientX,m0:m,
    dur0:+r.耗时||0, rows:(D.s8.行||[]).map(x=>({...x})), range:gtRange()};
  save();
});
document.addEventListener('pointermove',e=>{
  if(!gtDrag) return;
  const dm=(e.clientX-gtDrag.x0)/gtDrag.px;   /* 位移换算成分钟 */
  const{mode,m0,dur0,rows,i,range}=gtDrag;
  const r=rows[i];
  if(mode==='move'){
    r.时=m2t(snap(m0+dm));
  } else if(mode==='l'){
    /* 左边缘：结束时间钉住不动 → 开始 = 原结束 - 新时长 */
    const end=m0+dur0;
    const nd=Math.max(SNAP, snap(dur0-dm));
    r.时=m2t(end-nd); r.耗时=nd;
  } else {
    r.耗时=Math.max(SNAP, snap(dur0+dm));
  }
  gtDrag.range=gtRecalcRange(rows);
  gtPaintLive();
});
function gtEnd(){
  if(!gtDrag) return;
  const bar=document.querySelector('.gt-bar[data-gti="'+gtDrag.i+'"]');
  if(bar) bar.classList.remove('dragging');
  const i=gtDrag.i, rows=gtDrag.rows;
  gtDrag=null;
  /* 写回数据层：整行替换，保证「结束时间」参考值一起更新 */
  D.s8.行[i]=rows[i];
  save(); render();
  const r=D.s8.行[i];
  toast('已更新「'+(r.事||'该时段')+'」：'+r.时+' 起'
    +(+r.耗时? ' · '+r.耗时+' 分钟（至 '+(t2m(r.时)+ +r.耗时>=1440?'24:00':m2t(t2m(r.时)+ +r.耗时))+'）':''));
}
document.addEventListener('pointerup',gtEnd);
document.addEventListener('pointercancel',gtEnd);
/* 双击甘特条 → 滚动到 7.2 表格对应行并聚焦「事项」输入框 */
document.addEventListener('dblclick',e=>{

/* --------------------------------------------------------------------------
   器材汇总：6.1–6.4 → 6.5 器材总表
   --------------------------------------------------------------------------
   规则：
     · 同一张表内「品类+型号」完全相同的行合并数量
     · 跨表不合并（滤镜与镜头同名也不会是同一件东西，合并反而误导）
     · 品类为空时用该表默认名兜底（机身镜头 / 滤镜 / 灯光 / 附件）
     · 数量为空按 1 计（用户只想登记「带了什么」时不至于算成 0件）
   输出为多行文本，按品类分组，助理可逐行打勾。
   -------------------------------------------------------------------------- */
const GEAR_GROUP={
  器材:'机身镜头', 滤镜:'滤镜', 灯:'灯光', 附件:'附件'
};
/* v1.9：补来源标注，让 6.5 总表每行都能标出它来自 6.1–6.4 的哪张表，
   导出后助理按来源回溯核对，不用猜这条器材是从哪儿登记的。 */
const GEAR_SRC={
  器材:'6.1 器材清单', 滤镜:'6.2 滤镜',
  灯:'6.3 灯光器材', 附件:'6.4 附件'
};
function gearSummary(){
  const order=['器材','滤镜','灯','附件'];
  const lines=[]; const stat=[]; const rows=[];
  order.forEach(k=>{
    const src=(D.s6[k]||[]).filter(r=>
      String(r.品||'').trim()||String(r.型||'').trim());
    if(!src.length){ stat.push({k,label:GEAR_GROUP[k],n:0,pcs:0}); return; }
    /* 同表内合并「品类+型号」完全相同的行；跨表不合并 */
    const map=new Map();
    src.forEach(r=>{
      const 品=String(r.品||'').trim()||GEAR_GROUP[k];
      const 型=String(r.型||'').trim()||'（未填型号）';
      const 数=parseFloat(r.数); const q=isFinite(数)&&数>0?数:1;
      const key=品+' '+型;
      if(map.has(key)) map.get(key).q+=q;
      else map.set(key,{品,型,q,src:GEAR_SRC[k]});
    });
    const items=[...map.values()];
    items.forEach(x=>{
      lines.push(x.品+(x.型?' '+x.型:'')+' ×'+x.q);
      rows.push(x);
    });
    stat.push({k,label:GEAR_GROUP[k],n:items.length,
      pcs:items.reduce((s,x)=>s+x.q,0)});
  });
  return {lines,rows,stat,
    totalN:stat.reduce((s,x)=>s+x.n,0),
    totalP:stat.reduce((s,x)=>s+x.pcs,0)};
}

/* 存储占用指示条：常态显示 KB / 上限，≥75% 转黄，≥90% 转红并明确警示。
   挂到 window.__capBar 是为了让 save() 失败时也能立即刷新，不必等下次 render。 */
function updCap(){
  const el = $('#capBar');
  if (!el) return;
  const s = storageStat();
  const pct = Math.min(100, s.ratio * 100);
  const cls = s.ratio >= CAP_BLOCK ? 'cap full' : (s.ratio >= CAP_WARN ? 'cap warn' : 'cap');
  el.className = cls;
  el.innerHTML =
    '<div class="cap-t"><span>' + kb(s.used) + '</span><span>' + kb(s.total) + 'K</span></div>'
    + '<div class="cap-b"><div class="cap-f" style="width:' + pct.toFixed(1) + '%"></div></div>';
  el.title = '本地存储占用 ' + kb(s.used) + ' KB / ' + kb(s.total) + ' KB（'
    + pct.toFixed(0) + '%）\n图片 ' + s.imgN + ' 张\n'
    + (s.ratio >= CAP_BLOCK
        ? '⚠️ 已接近上限，新内容可能无法保存。请「导出整案」备份后删减图片。'
        : (s.ratio >= CAP_WARN
            ? '偏满。建议先「导出整案」备份，再删减参考图 / 样片。'
            : '空间充足。图片会占绝大部分体积。'));
}

function navRender(){
  const done=doneSet(), ALL=reqAll();

  ALL.forEach(([sec,k])=>{
    per[sec]=per[sec]||{d:0,t:0}; per[sec].t++;      /* 分母=必填项总数 */
    if(done.has(sec+'-'+k)) per[sec].d++;
  });
  /* v1.7 导航两级化：一级=章节（含必填完成度），二级=真实子节锚点。
     当前滚动到的位置（cur）所在的子节默认展开，其余折叠；
     展开状态记在 openSec，用户手动折叠/展开后不再被自动覆盖。 */
  const activeSub = cur+'|'+curSub;
  const isOpen = s => (openSec.has(s.id) || (openSec.size===0 && activeSub.startsWith(s.id+'|')));
  $('#nav').innerHTML = SECS.map(s=>{
    const p=per[s.id]; let cls='',st='';
    if(p){ const r=p.d/p.t;
      st=p.d+'/'+p.t; cls = r>=1?'done':(p.d>0?'part':''); }
    const open=isOpen(s);
    const sub=s.subs?s.subs.map(([sid,label])=>
      `<a href="#anc-${sid}" class="sub ${s.id+'|'+sid===activeSub?'on':''}"
        ><span>${esc(label)}</span></a>`).join(''):'';
    return `<div class="navgrp ${cls}">

    </div>`
    + (SEC_GAPS['after'+s.id]?`<div class="gapnote">${esc(SEC_GAPS['after'+s.id])}</div>`:'');
  }).join('');
}

/* input 事件：立即更新「强制项红框」与派生提示（如拍摄日星期、总功率），
   但不整体重渲染——否则输入框会失焦 */
function patchLive(el){
  const p=el.dataset.p; if(!p) return;
  /* 1. 字段红框 + 「⚠ 强制项未填」提示。
     注意：红框与提示是**两个独立节点**（.err 在控件上、.miss 是同级 div），
     只remove('err') 会让文字提示留在页面上——用户填完了还看到「强制项未填」，
     属于会误导决策的显示缺陷，故必须成对清除。 */
  if(el.classList.contains('err') && !REQ(el.value)) el.classList.remove('err');
  /* 1b. 强制项红框与「⚠ 强制项未填」提示双向同步（填上撤、删空恢复）。
     注意：红框与提示是两个独立节点（.err 在控件上、.miss 是同级 div），
     只 remove('err') 会让文字提示留在页面上——用户填完了还看到「强制项未填」，
     属于会误导决策的显示缺陷，故必须成对处理。 */
  syncMiss(el);
  /* 2. 派生提示 */
  if(p==='0.拍摄日期'){
    const box=el.closest('.f'); const hint=box&&box.querySelector('.hint');
    if(hint) hint.textContent = wk() ? ('拍摄日：'+wk()) : '填入后自动显示星期';
  }
  /* 3. §7 灯位：填了值就撤红框；并重算总功率 */
  const m=p.match(/^7\.灯位\.(\d+)\.(具|数|瓦|控数|电|方向)$/);
  if(m){ const k=m[2]==='具'?'具':m[2];
    document.querySelectorAll('[data-p="7.灯位.'+m[1]+'.'+k+'"]')
      .forEach(x=>x.classList.remove('err')); }
  if(/^7\.灯位\.\d+\.(瓦|数)$/.test(p)) updPower();
  /* 4. 总功率：用户手改后停止自动覆盖；清空则恢复自动并立即重算
        注意 REQ(v) 语义为「是否为空」：true=空，false=有值 */
  if(p==='7.总功率'){
    if(REQ(el.value)){ D.s7._pwAuto=true; updPower(); }   // 清空 → 恢复自动
    else              D.s7._pwAuto=false;                 // 手改 → 锁定
  }
  /* 5. v1.9 需求4：改 §8.2 timetable 的时间/时长/事项 → 甘特图与时段轴必须跟着动。
     之前只走 patchLive()（只清红框），甘特条与轴上节点都不重绘，
     表现为「表格改了时间，甘特图纹丝不动」——两处数据打架。
     局部重绘 §8，不整页 render（否则正在输入的框会失焦）。 */
  if(/^8\.行\.\d+\.(时|耗时|事)$/.test(p)) repaintGantt();
  /* v1.0.9 修复：6.1–6.4 任一字段变化 → 重算 6.5 只读总表。
     此前 6.5 只在首绘时算一次，用户填完 6.1–6.4 总表永远不刷新
     （与 v1.8「生成器材总单」按钮失效同源：数据进了D，却没人读它）。*/
  if(/^6\.(器材|滤镜|灯|附件)\.\d+\.(品|型|数|备)$/.test(p)) repaintGearTotal();
  /* v1.0.11：拍摄日期 / 拍摄时段变化 → 甘特轴的光影节点要重算。
     此前 PERIODS（上午/下午/晚上）这个下拉压根没有代码消费它——
     §0.2 写着「决定行程表起止时间与日落窗口」，实际改了毫无影响。
     现在时段真正生效了：上午→取上午那组，下午/晚上→取下午那组。*/
  if(p==='0.拍摄日期'||p==='0.时段'){
    /* 先更新 8.1 里的星期提示（拍摄日期改动的原有行为） */
    repaintGantt();
  }
}
/* 总功率 = Σ(功率 × 数量)
   注意：必须写回 D，不能只写 DOM —— 否则下一次 render() 会把手填结果冲掉。
   _pwAuto 为 true 表示「自动值」，用户手改后置false，停止自动覆盖。*/
function totalW(){
  return D.s7.灯位[0].reduce((s,r)=>{
    const w=parseFloat(r.瓦), n=parseFloat(r.数);
    return s+(isFinite(w)?w:0)*(isFinite(n)?n:0);
  },0);
}
/* v1.0.11：光影时刻手填覆盖的两个按钮。
   不用 onclick 内联—— 事件委托挂一次，后续重绘换掉元素也不用重新绑定。*/
document.addEventListener('click', e=>{
  const ap=e.target.closest('[data-solar-apply]');
  const cl=e.target.closest('[data-solar-clear]');
  if(!ap&&!cl) return;
  e.preventDefault();
  if(cl){
    delete SOLAR_OVR[shotMonth()];
    saveSolarOverride();
    repaintGantt();
    toast('已清除' + shotMonth() + ' 月手填值，回落到内置表');
    return;
  }
  /* 应用：把四个区间里「起点填了」的项收进覆盖对象。
     终点留空时用起点 + 时长反推，避免出现 05:00→空白这种半截数据。 */
  const box=e.target.closest('.solarbox'); if(!box) return;
  const cur=SOLAR_OVR[shotMonth()]||{};
  const out={...cur};
  let any=false;
  ['amG','amB','pmG','pmB'].forEach(k=>{
    const a=box.querySelector('[data-solar="'+k+'0"]');
    const b=box.querySelector('[data-solar="'+k+'1"]');
    if(!a) return;
    const s0=(a.value||'').trim(), s1=(b&&b.value||'').trim();
    if(!s0&&!s1){ delete out[k]; return; }
    let end=s1;
    if(!end&&s0){
      const st=t2m(s0); /* 内置时长作为默认长度 */
      const base=(SOLAR[shotMonth()]||{})[k]||['00:00','00:00'];
      let len=(t2m(base[1])??0)-(t2m(base[0])??0); if(!len) len=30;
      end=m2t((st??0)+len);
    }
    out[k]=[s0||end,end]; any=true;
  });
  if(!any){ toast('还没有填任何时刻','warn'); return; }
  SOLAR_OVR[shotMonth()]=out; saveSolarOverride();
  repaintGantt();
  toast('已应用' + shotMonth() + ' 月手填的光影时刻');
});

document.addEventListener('input',e=>{
  const p=e.target.dataset.p; if(!p) return;
  if(e.target.type==='radio'&&!e.target.checked) return;   // 单选：只响应选中项
  const v=e.target.type==='checkbox'||e.target.type==='radio'
    ? (e.target.type==='radio'?e.target.value:e.target.checked)
    : e.target.value;
  setByPath(p,v); save();
  patchLive(e.target);
  dispatchSync(p);          /* v1.7 §0↔§1 / §0↔§4 双向同步 */
  updProg();
});
document.addEventListener('change',e=>{
  const p=e.target.dataset.p; if(!p) return;
  if(e.target.type==='radio'&&!e.target.checked) return;
  const v=e.target.type==='radio'?e.target.value
    : (e.target.type==='checkbox'?e.target.checked:e.target.value);
  setByPath(p,v); save();
  /* v1.7：原「§0.3 选场地库 → 带入地点」与「§0.7 选模特库 → 调出 §1 档案」两处联动
     已随第四批需求 1（下线两个下拉）移除。
     场地主数据源仍是 §4 场地库、模特主数据源仍是 §1 模特档案；
     v1.7 起改为**双向同步**（dispatchSync），改哪边另一边都跟上。*/
  dispatchSync(p);

});

/* 图片：点击 /拖拽 */
document.addEventListener('click',async e=>{

    /* §4 场地参考图为数组：4.图.N → 删除第 N 张 */
    const mv=id.match(/^4\.图\.(\d+)$/);

      toast('已移除该图（剩余 '+D.s4.图.length+'/10）'); return; }
    /* v1.5 §1 模特样图为数组：1.样图.N → 删除第 N 张 */
    const ms=id.match(/^1\.样图\.(\d+)$/);
    if(ms){ D.s1.样图=D.s1.样图||[]; D.s1.样图.splice(+ms[1],1); save(); render();
      toast('已移除该图（剩余 '+D.s1.样图.length+'/2）'); return; }
    /* v1.5 §5 道具参考图为数组：5.图.N → 删除第 N 张 */
    const mp5=id.match(/^5\.图\.(\d+)$/);

      toast('已移除该图（剩余 '+D.s5.图.length+'/8）'); return; }

    const mp=id.match(/^11\.样片\.(\d+)$/);

      toast('已移除该图（剩余 '+D.s11.样片.length+'/'+S11_MAX+'）'); return; }
    setByPath(id,''); save(); render();

  const pk=e.target.closest('[data-pick]');

  const add=e.target.closest('[data-add]');

     若已有同一事项的行，则改为把该行时间对齐到这个节点。 */
  const slot=e.target.closest('[data-slot]');

    const s=slotSet().find(x=>x.k===k); if(!s) return;   /* v1.0.11: S8_SLOTS 已改为 slotSet() 函数 */

/* 行数组统一取用入口 */
function arrOf(k){
  if(k==='配饰') return D.s2.配饰[0];
  if(k==='灯位') return D.s7.灯位[0];
  if(k==='道具') return D.s5.道具;   /* v1.5 §5 道具清单 */
  if(k==='行程') return D.s8.行;      /* v1.6 §7 timetable 行数组 */
  /* v1.5 §6 摄影器材四子表（器材/滤镜/灯/附件） */
  if(['器材','滤镜','灯','附件'].includes(k)) return D.s6[k];
  return D.s2[k];
}

const CSV_SCHEMAS={
  models:{ file:'模特信息表.csv', cols:['姓名','身高(cm)','体重(kg)','体格特征','样图','更新时间'] },
  venues:{ file:'拍摄场地表.csv', cols:['编号','场地名称','所在区','适配风格',

function exportCSV(which){
  /* 接口占位：v1 走「下载全量 CSV」；v2 可换 File System Access 自动追加。
     技术路径与可行性见 04-资料库同步可行性调研.md */
  const S=CSV_SCHEMAS[which];
  const rows=which==='models'
    ? MODELS.map(m=>[m.姓名,m.身高,m.体重,m.备注,m.样图?'有':'无',(m.updatedAt||'').slice(0,10)])
    : VENUES.map(v=>[v.id,v.名称,v.所在区,v.适配风格,v.时效性,v.门票,
                     v.简述,(v.图||[]).length,(v.updatedAt||'').slice(0,10)]);
  const q=c=>'"'+String(c??'').replace(/"/g,'""')+'"';
  const csv='﻿'+[S.cols.map(q).join(','),...rows.map(r=>r.map(q).join(','))].join('\r\n');
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
  a.download=S.file; a.click(); URL.revokeObjectURL(a.href);
  toast('已导出 '+S.file+'（'+rows.length+' 条记录）\n追加新记录后请重新导出并覆盖');
}

document.addEventListener('change',async e=>{
  const fi=e.target.dataset.fi; if(!fi) return;
  /* §4 场地参考图为多图槽：一次可传多张 */
  if(fi==='4.图.add'){
    const files=[...e.target.files].filter(f=>f.type.startsWith('image/'));
    if(!files.length){ e.target.value=''; return; }
    const room=10-(D.s4.图||[]).length;
    if(files.length>room) toast('最多 10 张，已保留前 '+room+' 张');
    let added=0, lastKB=0, blocked=false;
    for(const f of files.slice(0,room)){
      const r=await shrink(f);
      ASSETS['4.图.'+D.s4.图.length]={mime:'image/jpeg',w:r.w,h:r.h,size:r.size,
        uploadedAt:new Date().toISOString()};
      D.s4.图.push(r.url);
      lastKB=Math.round(r.size/1024);
      /* 每张都存一次并检查结果——批量上传最容易撞配额，
         若中途失败必须立刻停，不能让后面几张白压 */
      if(!save()){ blocked=true; break; }
      added++;

    render(); e.target.value='';

      ? '⚠️ 存储已满，只加进 '+added+' 张（共 '+D.s4.图.length+'/10）\n'
        +'单张约 '+lastKB+' KB。请「导出整案」备份后删减已有图片。'

          (n<S11_MIN?'，还差 '+(S11_MIN-n)+' 张才达建议下限':'')); return;
  }
  const m11=fi.match(/^11\.样片\.(\d+)$/);
  if(m11){ D.s11.样片=D.s11.样片||[];
    await setPickArr('11.样片',D.s11.样片,+m11[1],e.target.files[0],S11_MAX);
    save(); render(); e.target.value=''; return; }
  await setPick(fi,e.target.files[0]); e.target.value='';
});
