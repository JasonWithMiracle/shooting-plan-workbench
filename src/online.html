/* ==========================================================================
   公共清理件：空小节标题隐藏（v1.0.14）
   --------------------------------------------------------------------------
   导出路径（printGate）与预览路径（cleanForPreview）**共用本函数**，
   保证两条路径的"所见即所得"判定完全一致 —— 否则会出现
   「预览里标题没了、导出的 PDF 里标题还在」这类不一致。

   场景：形如
       <h3>0.2 拍摄时间</h3>
       <div class="grid g3">
         <div class="f">…（字段全空，已被上一步隐藏）…</div>
       </div>
   字段隐藏后，标题与空容器仍留在纸面上形成"有标题无内容"的空壳。

   ★ 判据核心：**看元素是否真正参与布局** —— el.getClientRects().length > 0。
     不能用 getComputedStyle(el).display：父级 display:none 时，
     子元素自身计算值仍是原值（如 inline-block），会误判为"可见"。
     （此陷阱曾导致 23 处真实内容被误杀，已实测确证。）

   ★ 硬保护（任一命中即跳过，只为安全）：
     · 容器内含 <img src>（有参考图 = 有内容）
     · 容器内 <table> 表体任一格有实质内容（§10 风险表就是这样）
     · 容器内仍存在任一"有意义的可见元素"（文字 / 媒体 / 控件）

   @param root   限定作用范围（预览传 #pvContent；导出传 document）
   @param record 可选的记录回调，形如 (el, prevDisplay) => void，
                 用于导出路径登记以便打印后恢复；预览路径传 null（只清不还）。
   ========================================================================== */
function hideEmptySubsections(root, record){
  const visible = el => el.getClientRects().length > 0;
  const remember = (el) => { if(record) record(el, el.style.display); };
  /* 容器的"有内容"判定：容器内是否存在有意义的可见元素 */
  const boxHasContent = (box) => {
    if(!visible(box)) return false;
    /* 硬保护 1：有图 */
    if([...box.querySelectorAll('img')].some(im => im.getAttribute('src'))) return true;
    /* 硬保护 2：表格有实质内容 */
    const tbls = [...box.querySelectorAll('table')];
    if(tbls.some(t => {
      const rows = [...t.querySelectorAll('tr')].filter(tr => tr.querySelector('td'));
      return rows.some(tr => {
        if([...tr.querySelectorAll('img')].some(im => im.getAttribute('src'))) return true;
        if([...tr.querySelectorAll('input,textarea,select')].some(c => {
          if(c.type === 'hidden') return false;
          if(c.type === 'checkbox' || c.type === 'radio') return c.checked;
          if(c.tagName === 'SELECT') return c.value !== '';
          return String(c.value || '').trim() !== '';
        })) return true;
        const txt = tr.textContent.replace(/\s+/g,'').trim();
        return !!(txt && !/^[\u2b12\u25a1\u2610\u2605*+()（）0-9\/.\-—·，、：]+$/.test(txt));
      });
    })) return true;
    /* 一般判定：容器内是否有可见的实质元素 */
    return [...box.querySelectorAll('*')].some(e => {
      if(!visible(e)) return false;
      if(e.tagName === 'BR' || e.tagName === 'HR') return false;
      const cls = typeof e.className === 'string' ? e.className : '';
      if(/\b(grid|f|g[1-4]|gimg|lb|ph|rec|req|hint|badge|miss|note|no-print)\b/.test(cls)) return false;
      if(e.tagName === 'IMG' || e.tagName === 'SVG') return true;
      if(e.tagName === 'INPUT' || e.tagName === 'TEXTAREA' || e.tagName === 'SELECT') return true;
      return [...e.childNodes].some(n => n.nodeType === 3 && n.textContent.trim());
    });
  };

  root.querySelectorAll('h3').forEach(h3 => {
    if(!visible(h3)) return;                      // 已隐藏，跳过
    let box = h3.nextElementSibling;
    while(box && box.nodeType !== 1) box = box.nextElementSibling;
    if(!box) return;
    const bc = typeof box.className === 'string' ? box.className : '';
    if(!/\b(grid|f|tbl-wrap|ph-box)\b/.test(bc) && box.tagName !== 'DIV') return;

    if(boxHasContent(box)) return;                // 有内容 → 绝不动
    /* 无内容 → 标题连容器一起隐藏 */
    remember(h3); h3.style.display = 'none';
    if(visible(box)){ remember(box); box.style.display = 'none'; }
  });
}

/* ==========================================================================
   v1.0.14 缺陷 D-2 修复：导出前置"收口"——保证打印瞬间 DOM 是干净的
   --------------------------------------------------------------------------
   为什么必须有这个：
   `window.print()` / `page.pdf()` 捕获的是**当前这一瞬间**的整个页面。
   任何此刻可见的浮层都会进入成品 PDF：
     ① #toast（动态创建、z-index:9999）——「已移除该图」「存储已满」等 40+ 处会触发
     ② #lb（图片放大预览层）
     ③ #modal（门禁弹窗，"仍然导出"分支里它刚被 remove('on')，但存在竞态）
   此前它们或不在打印隐藏清单内、或隐藏时机晚于捕获时机，导致 PDF 被污染。
   对策：导出前统一强制关闭，并在打印返回后恢复现场（toast 不恢复，本就是瞬时提示）。
   ========================================================================== */
function printGate(act){
  const restore=[];
  const closeAll=()=>{
    const lt=document.getElementById('toast');
    if(lt){ restore.push([lt,'display',lt.style.display]); lt.style.display='none'; }
    const lb=document.getElementById('lb');
    if(lb&&lb.classList.contains('on')){ restore.push([lb,'class','on']); lb.classList.remove('on'); }
    const md=document.getElementById('modal');
    if(md&&md.classList.contains('on')){ restore.push([md,'class','on']); md.classList.remove('on'); }
    /* 注：select 空占位项（「— 请选择 —」）的摘除**不在本函数内**，
       统一由 beforeprint / afterprint 监听处理（见文件末尾的兜底块）——
       因为 window.print() 在真实浏览器里也会派发 beforeprint，两处都做会重复摘除，
       恢复时把 option 插回两次导致结构错乱（实测踩坑）。 */
    /* v1.0.14 缺陷 D-1 续：空字段整行隐藏（用户裁定）
       —— 未填写的字段连标签一起不打印，PDF 只呈现「已填的内容」。
       判定：一个 .f 内的所有表单控件都为空 → 整块隐藏。
       注意保守性：只要任一控件有值就保留（避免误杀"一行多控件、填了其一"的场景）。 */
    document.querySelectorAll('.f').forEach(f=>{
      const ctls=[...f.querySelectorAll('input,textarea,select')];
      if(!ctls.length) return;                 // 非表单块（纯展示）不动
      // 只读/隐藏控件不参与判定
      const live=ctls.filter(c=>c.type!=='hidden');
      if(!live.length) return;
      const hasVal=live.some(c=>{
        if(c.tagName==='SELECT') return c.value!=='';
        return String(c.value||'').trim()!=='';
      });
      if(hasVal) return;
      restore.push([f,'display',f.style.display]);
      f.style.display='none';
    });
    /* v1.0.14 缺陷 D-1 续：五类"空壳残留"统一清理（用户裁定：全空就整块隐藏）
       ① 空图片槽（.pick 未 .filled）——虚线上传框是编辑期骨架，不是内容
       ② 空态提示块（.ph-box）——「模特库还是空的…」这类引导语
       ③ 空表格——表体无任何有效值的表，连表头一起隐藏
       ④ 复选框 / 单选框——纯控件外观，无值可呈现
       统一在打印收口阶段处理，打印后原样恢复，不影响编辑。 */
    document.querySelectorAll('.pick').forEach(p=>{
      if(/filled/.test(p.className)) return;
      restore.push([p,'display',p.style.display]);
      p.style.display='none';
    });
    document.querySelectorAll('.ph-box').forEach(b=>{
      restore.push([b,'display',b.style.display]);
      b.style.display='none';
    });
    /* 复选框/单选框：所在的 <label>/<td>/<li> 若整块只服务于这个控件，
       则连容器一起隐藏；否则只隐藏控件本身（避免误删同行文字）。 */
    document.querySelectorAll('input[type=checkbox],input[type=radio]').forEach(c=>{
      const box=c.closest('label')||c.parentElement;
      const onlyCtl=box && box.children.length===1 && box.children[0]===c;
      const target=onlyCtl?box:c;
      restore.push([target,'display',target.style.display]);
      target.style.display='none';
    });
    /* 空表格：表体所有单元格都"无任何内容"才隐藏。
       ★ 判据必须涵盖**静态文本**——像 §10 风险表那样用 <td> 直接写
         "天气突变（暴雨/台风）"的表格，它是真实内容，绝不能隐藏。
       只有"表体每一格既无表单值、又无图片、又无实质文字"才判为空。 */
    document.querySelectorAll('table').forEach(t=>{
      const rows=[...t.querySelectorAll('tr')].filter(tr=>tr.querySelector('td'));
      if(!rows.length) return;
      const cellFilled=tr=>{
        // 有图 → 有内容
        if([...tr.querySelectorAll('img')].some(im=>im.getAttribute('src'))) return true;
        // 有任意非空表单值 → 有内容
        if([...tr.querySelectorAll('input,textarea,select')].some(c=>{
          if(c.type==='hidden') return false;
          if(c.type==='checkbox'||c.type==='radio') return c.checked;
          if(c.tagName==='SELECT') return c.value!=='';
          return String(c.value||'').trim()!=='';
        })) return true;
        // ★ 有实质文字（排除纯符号/计数）→ 有内容
        const txt=tr.textContent.replace(/\s+/g,'').trim();
        if(txt && !/^[\u2b12\u25a1\u2610\u2605*+()（）0-9\/.\-—·，、：]+$/.test(txt)) return true;
        return false;
      };
      if(rows.some(cellFilled)) return;
      const box=t.closest('.tbl-wrap')||t;
      restore.push([box,'display',box.style.display]);
      box.style.display='none';
    });
    /* v1.0.14：空小节标题隐藏（与预览路径共用 hideEmptySubsections，
       保证"预览所见 = 导出所得"）。record 回调把改动登记进 restore，
       打印结束后统一还原。 */
    hideEmptySubsections(document, (el, prev) => {
      restore.push([el, 'display', prev]);
    });

    /* 空图片槽的外层容器：形如 <div><label>妆面参考图</label><div>…<.pick></div>
       <div class="hint">…</div></div>，当其中唯一的 .pick 为空时，
       整个容器（连同 label 与"参考图"字样）都应隐藏。
       ★ 判定严格：容器内不得有 <img>、不得有除该 .pick 之外的表单控件、
         也不得有 .pick/.hint 之外的其他可见子元素（防误杀）。 */
    document.querySelectorAll('.pick').forEach(pk=>{
      if(/filled/.test(pk.className)) return;              // 有图 → 跳过
      // 向上找到"图片槽组合"的容器：含有 label 的那一层
      let box=pk.parentElement;
      for(let i=0;i<3&&box;i++){
        if(box.querySelector('label')) break;
        box=box.parentElement;
      }
      if(!box||!box.querySelector('label')) return;
      // 容器内不能有图
      if([...box.querySelectorAll('img')].some(im=>im.getAttribute('src'))) return;
      // 容器内不能有多个表单控件（只允许这一个空 .pick）
      const ctls=[...box.querySelectorAll('input,textarea,select')];
      if(ctls.length) return;
      // 容器内可见子元素只允许 label / .pick / .hint / .rec / .req
      const others=[...box.querySelectorAll('*')].filter(e=>{
        const cc=typeof e.className==='string'?e.className:'';
        if(e.tagName==='LABEL'||/\b(pick|hint|rec|req|lb|ph)\b/.test(cc)) return false;
        return getComputedStyle(e).display!=='none';
      });
      if(others.length) return;
      restore.push([box,'display',box.style.display]);
      box.style.display='none';
    });
  };
  const restoreAll=()=>{
    if(!restore.length) return;                 // 幂等：已恢复过就跳过
    restore.reverse().forEach(([el,kind,v])=>{
      if(kind==='display') el.style.display=v;
      else if(kind==='class') el.classList.add(v);
    });
    restore.length=0;
  };
  closeAll();
  /* ★ 恢复时机（v1.0.14 D-2 时序修复）：
     必须以 afterprint 为准 —— window.print() 会阻塞直到用户关闭打印对话框，
     但不同浏览器/自动化环境下这个事件不一定派发，故设一个"较长的"兜底定时器。
     不能设短（如 800ms）：用户可能还在打印对话框里选参数，提前恢复会让
     DOM 回到"脏"状态，打印结果仍被污染。 */
  let restored=false;
  const done=()=>{
    if(restored) return;
    restored=true;
    restoreAll();
    window.removeEventListener('afterprint',done);
  };
  window.addEventListener('afterprint',done);
  try{ act(); } finally{ setTimeout(done,60000); }   // 60s 兜底，足够覆盖人工操作
}

/* --------------------------------------------------------------------------
   beforeprint 兜底（v1.0.14）
   --------------------------------------------------------------------------
   场景：用户不用「打印 / 存 PDF」按钮，而是直接按 Ctrl+P 或浏览器菜单打印。
   此时 printGate 未被调用，select 的空占位项（「— 请选择 —」）会随页面
   一起打进 PDF —— 已被 PDF 文本提取实测确证（6 处残留）。

   ★ 为什么不能只靠 CSS：`select option[value=""]{display:none}` 对
     **当前被选中的 option** 无效 —— Chromium 会强制渲染 select 的当前值，
     无视该 option 的 display（实测确证）。故必须在打印前 JS 摘除。

   本监听在打印启动瞬间摘除占位 option；打印结束（afterprint）后插回，
   不影响编辑。与 printGate 共用同一套判定，避免两处规则漂移。 */
(function(){
  let saved = null;
  const strip = () => {
    if(saved) return;                       // 已在打印中，幂等
    saved = [];
    document.querySelectorAll('select').forEach(sel => {
      if(sel.value !== '') return;          // 已选中具体值 → 保留
      const ph = [...sel.options].find(o => o.value === '');
      if(!ph) return;
      saved.push([sel, ph, ph.index]);
      sel.removeChild(ph);
      sel.selectedIndex = -1;
    });
  };
  const restore = () => {
    if(!saved) return;
    saved.reverse().forEach(([sel, ph, idx]) => {
      try{ sel.add(ph, idx); }catch{ sel.appendChild(ph); }
      sel.selectedIndex = -1;
    });
    saved = null;
  };
  window.addEventListener('beforeprint', strip);
  window.addEventListener('afterprint', restore);
})();

/* ==========================================================================
   v1.0.14 · 预览浮层（P1-A：单纸面 + 分页虚线）
   --------------------------------------------------------------------------
   【设计目标】导出前核验 —— 预览所见 = 导出所得。

   【实现要点】
   1. 内容来源：克隆 `#main` 的 DOM 到浮层内 `.pv-scope` 容器。
      不用重新渲染，保证与当前编辑内容**逐字一致**（含尚未保存的输入）。
   2. 样式同源：`.pv-scope` 命中 `@media print,.pv-scope` 主样式块，
      预览与打印**共用同一份规则**，不存在两套样式漂移。
   3. 打印态清理：调用与导出路径相同的收口逻辑（closeAll），
      把编辑期骨架（按钮 / 上传框 / 空字段 / 空表…）清掉，
      使预览干净度与 PDF 一致。
   4. 分页虚线：版心宽 186mm、每页高 269mm（A4 @page 14mm 12mm 实测值）。
      每 269mm 画一道红虚线 + 页码，提示"此处会被真实分页切断"。
      ★ 屏幕介质下 Chromium 不分页，虚线是**高度均分推算**，非真实分页位置；
        实际导出受 .sec{break-inside:avoid-page} 影响可能与虚线有偏差（±1 页，用户已接受）。

   【为什么不真做多张纸】阶段 0 实测：CSS 多列断裂算法 ≠ 页断裂算法，恒定偏差 −2 页。
   ========================================================================== */

/* --------------------------------------------------------------------------
   预览样式镜像器（P1-A 关键机制）
   --------------------------------------------------------------------------
   问题：预览浮层在**屏幕介质**下渲染，而打印样式写在 `@media print` 里，
         屏幕态不生效 → 预览会带着一堆编辑期元素（.hint/.badge/空字段…）。

   误区（已实测证伪）：写 `@media print, .pv-scope{...}` 是**无效的** ——
         `.pv-scope` 会被当作媒体类型解析，整条 query 归一化为 `not all`，
         永不匹配，块内规则在屏幕态静默全部失效。

   正解：保持 `@media print` 单一维护点，运行时把它「镜像」成带 `.pv-scope`
         前缀的等价值，注入独立 <style>。只维护一份，预览自动同步。

   映射规则：
     · `html[data-theme="x"]` 这类根级选择器 → 改为 `.pv-scope`（变量宿主）
     · 普通选择器 `S` → `.pv-scope S`
     · 块级嵌套（如 `@page`）跳过
     · `#pv` 自身的隐藏规则跳过（否则浮层会把自己隐藏掉）
   -------------------------------------------------------------------------- */
function initPvMirror(){
  if(document.getElementById('pvMirror')) return;
  const out = [];
  const SKIP_SEL = /(^|,)\s*\.pv\b/;      // 跳过 .pv 浮层自身的规则

  for(const sheet of document.styleSheets){
    let rules;
    try{ rules = sheet.cssRules; }catch{ continue; }
    if(!rules) continue;
    for(const rule of rules){
      if(rule.type !== CSSRule.MEDIA_RULE) continue;
      if(!/\bprint\b/.test(rule.conditionText || rule.media.mediaText)) continue;
      for(const inner of rule.cssRules){
        if(inner.type !== CSSRule.STYLE_RULE) continue;   // 跳过 @page 等
        const sel = inner.selectorText || '';
        if(SKIP_SEL.test(sel)) continue;
        const scoped = sel.split(',').map(one => {
          const s = one.trim();
          if(!s) return s;
          /* 根级选择器 → 直接挂在 .pv-scope 上（用于变量覆盖） */
          if(/^html(\[|$)/.test(s)) return '.pv-scope';
          return '.pv-scope ' + s;
        }).join(',');
        out.push(scoped + '{' + inner.style.cssText + '}');
      }
    }
  }
  if(!out.length) return;
  const st = document.createElement('style');
  st.id = 'pvMirror';
  st.textContent = '/* 由 initPvMirror() 自动生成：@media print 的 .pv-scope 镜像 */\n'
    + out.join('\n');
  document.head.appendChild(st);
}
/* 变量覆盖的根级规则被映射成了 `.pv-scope`，但浮层内的 .pv-scope 是
   #pvContent 自身，变量需在浮层根上生效才能被后代继承 —— 补一条兜底：
   把打印态的白纸黑字变量同时挂到 .pv-scope 自身（上面已处理）。 */

const PV = (() => {
  const A4_W_MM   = 186;   // 210 - 12*2
  const A4_H_MM   = 269;   // 297 - 14*2
  const MM2PX     = 96 / 25.4;

  let snapshot = null;     // 打开前的现场快照（用于关闭时还原）

  const $pv = () => document.getElementById('pv');

  /* --- 打印态清理：与导出路径同源 -----------------------------------------
     直接复用 printGate 的清理逻辑会产生"恢复"副作用（它会 set 定时器还原）。
     预览是持续态，不需要还原，故这里单独实现一份"只清不还"的版本。
     两条路径的**判定规则必须一致** —— 见 printGate 里的同段注释。 */
  function cleanForPreview(root){
    /* ① select 空占位 option 摘除（Chromium 对已选中空 option 强制渲染） */
    root.querySelectorAll('select').forEach(sel => {
      if(sel.value !== '') return;
      const ph = [...sel.options].find(o => o.value === '');
      if(ph) sel.removeChild(ph);
      sel.selectedIndex = -1;
    });

    /* ② 空字段整行隐藏（一个 .f 内所有可见控件都为空 → 整块隐藏） */
    root.querySelectorAll('.f').forEach(f => {
      const live = [...f.querySelectorAll('input,textarea,select')]
        .filter(c => c.type !== 'hidden');
      if(!live.length) return;
      const hasVal = live.some(c => c.tagName === 'SELECT'
        ? c.value !== ''
        : String(c.value || '').trim() !== '');
      if(!hasVal) f.style.display = 'none';
    });

    /* ③ 空图片槽（.pick 未 .filled） */
    root.querySelectorAll('.pick').forEach(p => {
      if(!/filled/.test(p.className)) p.style.display = 'none';
    });

    /* ④ 空态提示块 */
    root.querySelectorAll('.ph-box').forEach(b => { b.style.display = 'none'; });

    /* ⑤ 复选框 / 单选框（纯控件外观） */
    root.querySelectorAll('input[type=checkbox],input[type=radio]').forEach(c => {
      const box = c.closest('label') || c.parentElement;
      const onlyCtl = box && box.children.length === 1 && box.children[0] === c;
      (onlyCtl ? box : c).style.display = 'none';
    });

    /* ⑥ 空表格（判据必须涵盖静态文本，否则会误杀 §10 风险表） */
    root.querySelectorAll('table').forEach(t => {
      const rows = [...t.querySelectorAll('tr')].filter(tr => tr.querySelector('td'));
      if(!rows.length) return;
      const cellFilled = tr => {
        if([...tr.querySelectorAll('img')].some(im => im.getAttribute('src'))) return true;
        if([...tr.querySelectorAll('input,textarea,select')].some(c => {
          if(c.type === 'hidden') return false;
          if(c.type === 'checkbox' || c.type === 'radio') return c.checked;
          if(c.tagName === 'SELECT') return c.value !== '';
          return String(c.value || '').trim() !== '';
        })) return true;
        const txt = tr.textContent.replace(/\s+/g,'').trim();
        if(txt && !/^[\u2b12\u25a1\u2610\u2605*+()（）0-9\/.\-—·，、：]+$/.test(txt)) return true;
        return false;
      };
      if(!rows.some(cellFilled)){
        const box = t.closest('.tbl-wrap') || t;
        box.style.display = 'none';
      }
    });

    /* ⑦ 空图片槽的外层容器（label + 空 .pick + hint）整块隐藏 */
    root.querySelectorAll('.pick').forEach(pk => {
      if(/filled/.test(pk.className)) return;
      let box = pk.parentElement;
      for(let i = 0; i < 3 && box; i++){
        if(box.querySelector('label')) break;
        box = box.parentElement;
      }
      if(!box || !box.querySelector('label')) return;
      if([...box.querySelectorAll('img')].some(im => im.getAttribute('src'))) return;
      if(box.querySelectorAll('input,textarea,select').length) return;
      const others = [...box.querySelectorAll('*')].filter(e => {
        const cc = typeof e.className === 'string' ? e.className : '';
        if(e.tagName === 'LABEL' || /\b(pick|hint|rec|req|lb|ph)\b/.test(cc)) return false;
        return getComputedStyle(e).display !== 'none';
      });
      if(others.length) return;
      box.style.display = 'none';
    });

    /* ⑧ 空小节标题隐藏 —— 调用公共件 hideEmptySubsections，
       与导出路径（printGate）共用同一判据，保证预览与 PDF 完全一致。
       预览态是持续态，不需要还原，故 record 传 null（只清不还）。 */
    hideEmptySubsections(root, null);
  }

  /* --- 构建预览内容 ------------------------------------------------------- */
  function buildContent(){
    const src  = document.getElementById('main');
    const dest = document.getElementById('pvContent');
    dest.innerHTML = '';
    if(!src) return;

    /* 只克隆「章节」节点：跳过 #main 里可能的非内容装饰 */
    const secs = [...src.children];
    secs.forEach(node => {
      const c = node.cloneNode(true);
      /* 克隆体里的表单控件带 id 会与主文档冲突 —— 剥掉 id，
         同时清掉 tabindex / 焦点态，避免预览里的 ghost 焦点 */
      c.querySelectorAll('[id]').forEach(e => e.removeAttribute('id'));
      c.querySelectorAll('[tabindex]').forEach(e => e.removeAttribute('tabindex'));
      dest.appendChild(c);
    });

    /* 图片：克隆的是 <img src=dataURL>，无需额外处理；
       但用户在编辑态可能正开着某图的删除钮等浮层——克隆不会带走浮层。 */

    /* 打印态清理（预览态不要编辑骨架） */
    cleanForPreview(dest);

    /* .pv-scope 是样式作用域锚点，挂到内容根 */
    dest.classList.add('pv-scope');
  }

  /* --- 分页虚线 + 页码 ---------------------------------------------------- */
  function drawRules(){
    const paper = document.getElementById('pvPaper');
    const rules = document.getElementById('pvRules');
    const content = document.getElementById('pvContent');
    rules.innerHTML = '';
    if(!paper || !rules || !content) return 0;

    /* 版心总高（px）：内容高度 + 上下 14mm 内边距 */
    const paperH = paper.getBoundingClientRect().height;
    const pageH  = A4_H_MM * MM2PX;            // 每页高（px）
    /* 内容实际从 14mm 内边距后开始，故分页线位置需与之对齐：
       第 1 页内容区 = [padTop, padTop+pageH]，第 2 页 = [padTop+pageH, padTop+2*pageH] …
       由于 .pv-paper 的 padding 已含 14mm，直接按 paperH 均分即可。 */
    const padTop = 14 * MM2PX;
    const avail = paperH - padTop * 2;         // 去掉上下留白后的内容可用高
    const pages = Math.max(1, Math.ceil(avail / pageH - 1e-6));

    for(let i = 1; i < pages; i++){
      const y = padTop + i * pageH;
      const line = document.createElement('div');
      line.className = 'pv-rule';
      line.style.top = y + 'px';
      const lb = document.createElement('span');
      lb.className = 'pv-rule-lb';
      lb.textContent = '第 ' + (i + 1) + ' 页';
      line.appendChild(lb);
      rules.appendChild(line);
    }
    return pages;
  }

  /* --- 缺项提示（纸张外的气泡条） ----------------------------------------- */
  function renderMiss(){
    const bar = document.getElementById('pvMiss');
    const warn = document.getElementById('pvWarn');
    const m = missing();
    if(!m.length){
      bar.hidden = true;
      bar.innerHTML = '';
      if(warn){ warn.hidden = true; warn.textContent = ''; }
      return;
    }
    /* 气泡条：最多列 6 项，其余折叠为"等 N 项" */
    const shown = m.slice(0, 6).map(x => `· ${esc(x[2])}`).join('　');
    const more  = m.length > 6 ? `　…等 <b>${m.length}</b> 项` : '';
    bar.hidden = false;
    bar.innerHTML = `⚠ 还有 <b>${m.length}</b> 个强制项未填，导出前建议补全：`
      + `<div class="pv-miss-list">${shown}${more}</div>`;
    if(warn){
      warn.hidden = false;
      warn.textContent = `⚠ ${m.length} 项未填`;
    }
  }

  /* --- 打开 / 关闭 -------------------------------------------------------- */
  function open(){
    const el = $pv();
    if(!el || el.classList.contains('on')) return;

    /* 保存现场：记录当前滚动位置与焦点，关闭时还原 */
    snapshot = {
      scrollY: window.scrollY,
      active: document.activeElement && document.activeElement.blur
        ? (document.activeElement.blur(), true) : false
    };

    /* ★ 顺序至关重要：必须**先显示浮层**，再执行清理。
       cleanForPreview 用 getClientRects() 判断元素是否真正可见 ——
       若浮层尚为 display:none，所有元素都量不到布局盒，
       会把全部内容误判为"空"而大面积误杀（实测踩坑）。 */
    el.classList.add('on');
    buildContent();

    /* 关键：等一帧再量高度（图片/字体可能仍在布局） */
    requestAnimationFrame(() => {
      const pages = drawRules();
      const info = document.getElementById('pvPageInfo');
      if(info) info.innerHTML = `共 <b>${pages}</b> 页`;
      renderMiss();
    });

    /* 图片加载完可能改变高度 —— 重算一次 */
    const imgs = [...document.querySelectorAll('#pvContent img')];
    let pending = imgs.filter(im => !im.complete).length;
    if(pending){
      imgs.forEach(im => {
        if(im.complete) return;
        const done = () => {
          if(--pending === 0){
            const pages = drawRules();
            const info = document.getElementById('pvPageInfo');
            if(info) info.innerHTML = `共 <b>${pages}</b> 页`;
          }
        };
        im.addEventListener('load', done, { once: true });
        im.addEventListener('error', done, { once: true });
      });
    }
  }

  function close(){
    const el = $pv();
    if(!el) return;
    el.classList.remove('on');
    /* 清内容，释放内存（图片是 base64，克隆体持有引用） */
    const dest = document.getElementById('pvContent');
    if(dest) dest.innerHTML = '';
    const rules = document.getElementById('pvRules');
    if(rules) rules.innerHTML = '';
    /* 还原滚动位置 */
    if(snapshot && typeof snapshot.scrollY === 'number'){
      window.scrollTo(0, snapshot.scrollY);
    }
    snapshot = null;
  }

  function isOpen(){
    const el = $pv();
    return !!(el && el.classList.contains('on'));
  }

  return { open, close, isOpen, drawRules };
})();

/* ==========================================================================
   整案导出 / 导入（数据备份与跨设备转移）
   --------------------------------------------------------------------------
   为什么必须有这个：顶栏的「打印 / 存PDF」产出的是**排版好的成品**，
   拿到手是一份死文档，**不能恢复数据**。而数据在本机 localStorage，
   换设备等于重填。本功能导出的 .json 才能原样恢复。
   ========================================================================== */
const EXP_FORMAT='sw-workbench';   /* 格式标识：用于将来识别不同版本 */
function exportAll(){
  const payload={ format:EXP_FORMAT, version:'1.1.0',
    exportedAt:new Date().toISOString(),
    doc:D, models:MODELS, venues:VENUES, usedno:AUTO_NO.used };
  const stamp=new Date(), p=n=>String(n).padStart(2,'0');
  const name=(D.s0.编号||'未分配').replace(/[^\w-]/g,'');
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([JSON.stringify(payload,null,1)],
    {type:'application/json'}));
  a.download=`${name}_工作台备份_${stamp.getFullYear()}${p(stamp.getMonth()+1)}${p(stamp.getDate())}.json`;
  a.click(); URL.revokeObjectURL(a.href);
  toast('已导出整案备份\n含：12 章节内容 + 模特库 + 场地库 + 编号占用表\n'
      +'换设备时用「导入整案」恢复');
}
async function importAll(file){
  if(!file) return;
  let obj;
  try{ obj=JSON.parse(await file.text()); }
  catch(err){
    toast('导入失败：文件不是有效的 JSON\n'
      +'请确认选的是本工具导出的 .json 备份文件'); return; }
  if(!obj || obj.format!==EXP_FORMAT || !obj.doc){
    toast('导入失败：这不是本工作台的备份文件\n'
      +'（缺少 format="'+EXP_FORMAT+'" 标识）'); return; }
  /* 导入前先确认——会覆盖当前所有已填内容，不可撤销 */
  const nModel=(obj.models||[]).length, nVenue=(obj.venues||[]).length;
  if(!confirm('确定导入这份备份？\n\n'
    +'策划案编号：'+(obj.doc.s0?.编号||'未分配')+'\n'
    +'拍摄主题：'+(obj.doc.s0?.拍摄主题||'未填')+'\n'
    +'模特库：'+nModel+' 位· 场地库：'+nVenue+' 处\n'
    +'导出时间：'+(obj.exportedAt||'未知').slice(0,16).replace('T',' ')+'\n\n'
    +'⚠️ 当前未导出的内容将被覆盖，且无法撤销。')) return;
  try{
    D=obj.doc;
    MODELS=Array.isArray(obj.models)?obj.models:[];
    VENUES=Array.isArray(obj.venues)?obj.venues:[];
    if(obj.usedno && typeof obj.usedno==='object') AUTO_NO.used=obj.usedno;
    /* 场馆库的自增序号需按导入内容重算，否则新建场地会与已有 id 撞号 */
    _venueSeq=VENUES.reduce((m,v)=>Math.max(m,+String(v.id).replace(/\D/g,'')||0),0);
    save(); saveModels(); saveVenues();
    location.reload();   /* 重载确保所有模块拿到新数据 */
  }catch(err){
    toast('导入失败：数据格式异常\n'+err.message); }
}

/* 导航高亮 + 拖拽排序
   v1.7：同时观察「章节 section」与「子节锚点[id^=anc-]」，
   滚动到哪一节，导航就高亮哪一条并自动展开对应章节。
   v1.8 修复：原来只在 setTimeout(0) 里绑定一次，但 render() 会重建 #main
   整棵子树，observer 持有的仍是已销毁的旧节点 → 回调永远不再触发，
   蓝色标签就一直是「0. 基本信息」。改为：
     ① 提供 ioRebind()，在每次 render() 后重新observe；
     ② 额外挂scroll 兜底（rAF节流），即便 observer 漏事件也能纠正高亮。 */
function _setCur(id){
  if(id.startsWith('anc-')){
    const sid=id.slice(4).replace(/-(\d+)$/,'');
    cur=sid; curSub=id.slice(4);
  } else {
    cur=id.replace('sec-','');
    const sec=SECS.find(x=>x.id===cur);
    if(sec&&sec.subs&&sec.subs.length) curSub=sec.subs[0][0];
  }
  navRender();
}
const io=new IntersectionObserver(es=>{
  /*只取当前真正处于顶部判定带内的那个，避免批量回调时顺序错乱。
     排序键用 top 的绝对值：越接近判定线（top≈110px）越优先。
     v1.8：页面滚到底部时 io 的判定带（-78% 下边距）覆盖不到末节，
     会把高亮打回上一节 —— 此时直接跳过，交给 _scrollPick 兜底。 */
  const maxY=document.documentElement.scrollHeight-window.innerHeight;
  if(window.scrollY>=maxY-4) return;
  const hit=es.filter(e=>e.isIntersecting)
    .sort((a,b)=>Math.abs(a.boundingClientRect.top-110)
                  -Math.abs(b.boundingClientRect.top-110))[0];
  if(hit) _setCur(hit.target.id);
},{rootMargin:'-110px 0px -78% 0px',threshold:0});
function ioRebind(){
  io.disconnect();
  document.querySelectorAll('main section.sec').forEach(s=>io.observe(s));
  document.querySelectorAll('[id^="anc-"]').forEach(s=>io.observe(s));
}
/* 滚动兜底：取视口顶部判定线（top+110px）上方最近的章节 / 子节。
   判定线贴近视口顶端：若放太靠下（曾用 28% 视口高），scrollIntoView()
   刚把目标章节顶到屏幕上时它还在判定线下方，导航会显示上一节。
   110px 略大于顶部工具条高度，保证「点导航跳过去」时高亮已经跟上。*/
let _rafPending=false;
function _scrollPick(){
  _rafPending=false;
  /* 用 getBoundingClientRect 而非 offsetTop：offsetTop 相对 offsetParent，
     祖先若有定位/变换会算错位置。
     判定线 line：默认距视口顶部 110px（略大于顶部工具条高度）。
     但若已滚到底部，页面无法再滚，最后一节永远到不了判定线 →
     此时把判定线下移到视口底部，保证末节能被点亮。 */
  let line=110;
  const maxY=document.documentElement.scrollHeight-window.innerHeight;
  if(window.scrollY>=maxY-4){
    line=Math.max(110, window.innerHeight-8);
  }
  const secs=[...document.querySelectorAll('main section.sec')]
    .filter(s=>s.getBoundingClientRect().top<=line);
  const sec=secs.length?secs[secs.length-1]:null;
  if(!sec) return;
  const sid=sec.id.replace('sec-','');
  const anc=[...sec.querySelectorAll('[id^="anc-"]')]
    .filter(a=>a.getBoundingClientRect().top<=line);
  const sub=anc.length?anc[anc.length-1].id.replace('anc-',''):null;
  if(sid===cur&&sub===curSub) return;
  cur=sid;
  if(sub) curSub=sub;
  else{ const s2=SECS.find(x=>x.id===sid);
        if(s2&&s2.subs&&s2.subs.length) curSub=s2.subs[0][0]; }
  navRender();
}
window.addEventListener('scroll',()=>{
  if(_rafPending) return;
  _rafPending=true;
  requestAnimationFrame(_scrollPick);
},{passive:true});
/* 章节展开/收起（v1.7）—— 点箭头手动折叠，openSec 有值后不再自动展开 */
document.addEventListener('click',e=>{
  const f=e.target.closest('[data-fold]'); if(!f) return;
  const id=f.dataset.fold;
  const sec=SECS.find(x=>x.id===id); if(!sec) return;
  const isOpenNow=openSec.size?openSec.has(id)
    :(curSub.startsWith(id+'-'));
  if(isOpenNow) openSec.delete(id); else openSec.add(id);
  navRender();
});
document.addEventListener('DOMContentLoaded',()=>{
  syncVersion();
  initPvMirror();          /* v1.0.14：生成预览态样式镜像（@media print → .pv-scope） */
  render();
});

let dragK=null,dragI=null;
document.addEventListener('dragstart',e=>{
  const tr=e.target.closest('[data-row]'); if(!tr) return;
  const[k,i]=tr.dataset.row.split('.'); dragK=k; dragI=+i; tr.classList.add('dragging');
});
document.addEventListener('dragend',e=>{
  document.querySelectorAll('tr').forEach(x=>x.classList.remove('dragging','over'));
});
document.addEventListener('dragover',e=>{
  const tr=e.target.closest('[data-row]'); if(!tr||dragK===null) return;
  if(tr.dataset.row.split('.')[0]!==dragK) return;
  e.preventDefault(); tr.classList.add('over');
});
document.addEventListener('drop',e=>{
  const tr=e.target.closest('[data-row]');
  if(!tr||dragK===null) return;
  const[k,i]=tr.dataset.row.split('.');
  if(k!==dragK||+i===dragI){ dragK=null; return; }
  const arr=(k==='配饰'?D.s2.配饰[0]:k==='灯位'?D.s7.灯位[0]:D.s2[k]);
  const [m]=arr.splice(dragI,1); arr.splice(+i,0,m);
  dragK=null; save(); render();
});

/* toast */
let tT;
function toast(msg){
  let el=document.getElementById('toast');
  if(!el){ el=document.createElement('div'); el.id='toast';
    el.style.cssText='position:fixed;bottom:26px;left:50%;transform:translateX(-50%);'
      +'background:var(--panel);border:1px solid var(--border);border-radius:10px;'
      +'padding:12px 20px;font-size:13px;box-shadow:var(--sh);z-index:9999;max-width:80vw;'
      +'white-space:pre-line;color:var(--text)';
    document.body.appendChild(el); }
  el.textContent=msg; el.style.display='block';
  clearTimeout(tT); tT=setTimeout(()=>el.style.display='none',3800);
}

/* ==========================================================================
   v1.0.12 兜底：首绘哨兵 + 白屏可读提示
   --------------------------------------------------------------------------
   有了 §0 的存储安全层，已知的白屏根因已消除。但本脚本是一整段顶层
   <script>，**任何**未预期的顶层异常仍会导致「导航空、主体白」的无声失败。
   与其让用户对着白屏发呆，不如主动判断并给出一条能自救的提示。

   机制：DOMContentLoaded 后给首绘一次机会（下一帧检查）。
   若 window.__booted 仍为 false → 页面上渲染一块故障面板：
     · 说明「数据可能损坏，工具已尝试自动修复」
     · 提供「清空本地数据并重启」按钮（走 lsPurgeAll + reload）
     · 提供「导出诊断信息」按钮，便于把 console 错误发来排查
   ========================================================================== */
window.addEventListener('error', function(ev){
  try {
    if (window.console && console.error) {
      console.error('[boot] 未捕获异常：', ev && (ev.message || ev.error));
    }
  } catch (e) {}
});

window.addEventListener('DOMContentLoaded', function(){
  /* 让 page 首绘（同事件里注册的 render）先跑完，再判断 */
  setTimeout(function(){
    if (window.__booted) return;          // 首绘成功，正常路径
    showBootFailure();
  }, 400);
});

function showBootFailure(){
  if (document.getElementById('__boot_fail')) return;
  var box = document.createElement('div');
  box.id = '__boot_fail';
  box.style.cssText = 'position:fixed;inset:0;z-index:99999;display:flex;'
    + 'align-items:center;justify-content:center;background:#f6f7f9;'
    + 'font:14px/1.7 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif;color:#222;padding:24px';
  var card = document.createElement('div');
  card.style.cssText = 'max-width:520px;background:#fff;border:1px solid #e3e6ea;'
    + 'border-radius:12px;padding:24px 26px;box-shadow:0 8px 30px rgba(0,0,0,.08)';
  card.innerHTML =
      '<h2 style="margin:0 0 10px;font-size:17px">⚠ 工具未能正常启动</h2>'
    + '<p style="margin:0 0 8px">多半是本机缓存的<b>数据损坏</b>，或浏览器<b>禁用了本地存储</b>'
    + '（无痕模式 / 站点策略），导致脚本启动中断。</p>'
    + '<p style="margin:0 0 16px;color:#666">已缓存的策划案会随清理一并删除，'
    + '清空前请确认没有未导出的重要内容。</p>';
  var b1 = document.createElement('button');
  b1.textContent = '清空本地数据并重启';
  b1.style.cssText = 'background:#2563eb;color:#fff;border:0;border-radius:8px;'
    + 'padding:10px 16px;font-size:14px;cursor:pointer;margin-right:10px';
  b1.onclick = function(){
    try { lsPurgeAll(); } catch (e) {}
    try { location.reload(); } catch (e) { location.href = location.href; }
  };
  var b2 = document.createElement('button');
  b2.textContent = '导出诊断信息';
  b2.style.cssText = 'background:#fff;color:#222;border:1px solid #d5d9de;border-radius:8px;'
    + 'padding:10px 16px;font-size:14px;cursor:pointer';
  b2.onclick = function(){
    var lines = [];
    lines.push('ver=' + (typeof APP_VER !== 'undefined' ? APP_VER : '?'));
    lines.push('ua=' + navigator.userAgent);
    lines.push('href=' + location.href);
    lines.push('ls_ok=' + (LS_NS && LS_NS.ok));
    try {
      ['sw_doc_v01','sw_usedno','sw_models','sw_venues','sw_solar_override'].forEach(function(k){
        var s = localStorage.getItem(k);
        lines.push(k + ': ' + (s === null ? '(未设置)' : (s.length + ' 字符, 前80=' + s.slice(0,80))));
      });
    } catch (e) { lines.push('(localStorage 不可读: ' + e.message + ')'); }
    var txt = lines.join('\n');
    var ta = document.createElement('textarea');
    ta.value = txt; ta.style.cssText = 'width:100%;height:120px;margin-top:14px;'
      + 'font:12px/1.5 monospace;border:1px solid #d5d9de;border-radius:6px;padding:8px';
    ta.readOnly = true;
    card.appendChild(ta); ta.select();
    try { document.execCommand('copy'); b2.textContent = '已复制 ✓'; } catch (e) {}
  };
  card.appendChild(b1); card.appendChild(b2);
  box.appendChild(card);
  document.body.appendChild(box);
}
</script>
