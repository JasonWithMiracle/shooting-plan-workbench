<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>拍摄策划工作台 · 原型 v0.1</title>
<style>
/* ============================================================
   主题注册表 —— 新增主题只需往这里加一组 token 值
   ============================================================ */
:root{
  --r:10px; --r2:7px; --r3:5px;
  --ff:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  --fm:ui-monospace,"SF Mono",Consolas,monospace;
  --sh:0 1px 3px rgba(0,0,0,.06),0 8px 24px rgba(0,0,0,.06);
}
html[data-theme="light"]{
  --bg:#f4f6f8; --panel:#ffffff; --panel2:#f7f9fb; --border:#dde3ea;
  --text:#1a1d23; --text2:#5b6472; --text3:#939cab;
  --accent:#2f6fa8; --accent-bg:#e8f0f8;
  --green:#2e8b57; --amber:#b87514; --red:#c43d3d; --purple:#7d5ba6; --teal:#17827d;
  --req:#c43d3d; --ph:#eef1f5;
}
html[data-theme="dark"]{
  --bg:#0f1115; --panel:#171a21; --panel2:#1e222b; --border:#2a2f3a;
  --text:#e8eaed; --text2:#9aa0ac; --text3:#6b7280;
  --accent:#5b9dd9; --accent-bg:#1c2836;
  --green:#5cb85c; --amber:#e0a458; --red:#e05c5c; --purple:#a67dd4; --teal:#4cbfb3;
  --req:#e05c5c; --ph:#1a1e26;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:var(--ff);background:var(--bg);color:var(--text);
  font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased}
input,select,textarea,button{font-family:inherit;font-size:inherit;color:inherit}

/* ============ 顶栏 ============ */
.top{position:sticky;top:0;z-index:100;background:var(--panel);
  border-bottom:1px solid var(--border);box-shadow:var(--sh)}
.top-in{max-width:1560px;margin:0 auto;padding:12px 22px;
  display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:210px}
.brand .logo{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;
  background:var(--accent-bg);color:var(--accent);font-size:16px;flex-shrink:0}
.brand h1{font-size:15px;font-weight:600;letter-spacing:.3px}
.brand .sub{font-size:11px;color:var(--text3);margin-top:-2px}

.prog{flex:1;min-width:220px;max-width:380px}
.prog-hd{display:flex;justify-content:space-between;font-size:11px;
  color:var(--text2);margin-bottom:5px}
.prog-hd b{color:var(--accent);font-variant-numeric:tabular-nums}
.bar{height:6px;background:var(--ph);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:3px;
  transition:width .35s cubic-bezier(.4,0,.2,1)}

.tools{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.seg{display:flex;background:var(--panel2);border:1px solid var(--border);
  border-radius:var(--r2);overflow:hidden}
.seg button{background:transparent;border:none;padding:6px 12px;cursor:pointer;
  font-size:12px;color:var(--text2);transition:.14s;border-right:1px solid var(--border)}
.seg button:last-child{border-right:none}
.seg button:hover{color:var(--text)}
.seg button.on{background:var(--accent);color:#fff;font-weight:500}
html[data-theme="dark"] .seg button.on{color:#0f1115}
.btn{background:var(--panel2);border:1px solid var(--border);color:var(--text2);
  padding:7px 13px;border-radius:var(--r2);cursor:pointer;font-size:12px;
  transition:.14s;white-space:nowrap}
.btn:hover:not(:disabled){color:var(--text);border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:500}
html[data-theme="dark"] .btn.pri{color:#0f1115}
.btn.pri:hover{opacity:.9}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:4px 9px;font-size:11px}

/* ============ 布局 ============ */
.shell{max-width:1560px;margin:0 auto;display:grid;
  grid-template-columns:212px 1fr;gap:0;align-items:start}
.side{position:sticky;top:59px;padding:20px 12px 40px 22px;
  max-height:calc(100vh - 59px);overflow-y:auto}
.side-t{font-size:10px;color:var(--text3);text-transform:uppercase;
  letter-spacing:1.2px;padding:0 8px 10px}
.nav a{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:var(--r2);
  text-decoration:none;color:var(--text2);font-size:12.5px;transition:.14s;
  border-left:2px solid transparent}
.nav a:hover{background:var(--panel2);color:var(--text)}
.nav a.on{background:var(--accent-bg);color:var(--accent);font-weight:500;
  border-left-color:var(--accent)}
.nav a .st{font-size:10px;margin-left:auto;font-variant-numeric:tabular-nums;
  color:var(--text3);flex-shrink:0}
.nav a.done .st{color:var(--green)}
.nav a.part .st{color:var(--amber)}
.nav .gap{height:1px;background:var(--border);margin:9px 8px}
.nav .dim{opacity:.55}

.main{padding:20px 26px 90px;min-width:0}

/* ============ 章节卡 ============ */
.sec{background:var(--panel);border:1px solid var(--border);border-radius:var(--r);
  padding:22px 24px;margin-bottom:18px;scroll-margin-top:74px}
.sec-h{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.sec-h h2{font-size:15px;font-weight:600}
.sec-n{font-family:var(--fm);font-size:11px;color:var(--text3);
  background:var(--panel2);padding:2px 7px;border-radius:var(--r3)}
.badge{font-size:10px;padding:2px 8px;border-radius:20px;margin-left:auto;white-space:nowrap}
.b-req{background:rgba(196,61,61,.12);color:var(--req)}
.b-rec{background:rgba(184,117,20,.12);color:var(--amber)}
.b-off{background:var(--panel2);color:var(--text3);border:1px solid var(--border)}
.sec-d{font-size:12px;color:var(--text3);margin-bottom:16px;
  padding-bottom:14px;border-bottom:1px dashed var(--border)}
h3{font-size:12px;font-weight:600;color:var(--text2);margin:20px 0 10px;
  letter-spacing:.4px;display:flex;align-items:center;gap:7px}
h3:first-of-type{margin-top:6px}
h3::before{content:"";width:3px;height:12px;background:var(--accent);border-radius:2px}

/* ============ 表单 ============ */
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
/* v1.5 补齐 .g5（此前从未定义，导致 §4 场地参考图与 §11 参考样片
   虽写了 grid g5 却实际单列纵向堆叠，一屏看不全）。
   图片类网格统一用 auto-fill + 最小列宽：容器变宽自动多排，变窄自动少排，
   比固定 5 列更能「排布整齐」且不会溢出。 */
.g5{grid-template-columns:repeat(5,1fr)}
.gimg{grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:9px}
@media(max-width:1100px){.g3,.g4,.g5{grid-template-columns:repeat(2,1fr)}}
@media(max-width:760px){.g2,.g3,.g4,.g5{grid-template-columns:1fr}}

.f{display:flex;flex-direction:column;gap:5px;min-width:0}
.f label{font-size:11.5px;color:var(--text2);display:flex;align-items:center;gap:5px}
.req{color:var(--req);font-weight:700;font-size:13px;line-height:1}
.rec{color:var(--amber);font-size:11px}
.f input,.f select,.f textarea{background:var(--panel2);border:1px solid var(--border);
  border-radius:var(--r2);padding:8px 11px;font-size:13px;width:100%;transition:.14s}
.f textarea{resize:vertical;min-height:62px;line-height:1.65}
.f input:focus,.f select:focus,.f textarea:focus{
  outline:none;border-color:var(--accent);background:var(--panel)}
.f input.err,.f textarea.err,.f select.err{border-color:var(--req);
  background:rgba(196,61,61,.05)}
.f .hint{font-size:10.5px;color:var(--text3)}
.f .miss{font-size:10.5px;color:var(--req);display:flex;align-items:center;gap:3px}
.f input::placeholder,.f textarea::placeholder{color:var(--text3);opacity:.7}

/* ============ 表格 ============ */
.tbl-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--r2);
  margin-bottom:10px;background:var(--panel)}
table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:560px}
th{background:var(--panel2);padding:8px 10px;font-size:11px;color:var(--text2);
  font-weight:600;text-align:left;border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:5px 8px;border-bottom:1px solid var(--border);vertical-align:middle}
tr:last-child td{border-bottom:none}
tbody tr:hover{background:rgba(47,111,168,.035)}
td input,td select{width:100%;background:transparent;border:1px solid transparent;
  border-radius:var(--r3);padding:6px 8px;font-size:12.5px;transition:.14s}
td input:hover,td select:hover{border-color:var(--border);background:var(--panel2)}
td input:focus,td select:focus{outline:none;border-color:var(--accent);background:var(--panel)}
td input.err{border-color:var(--req);background:rgba(196,61,61,.05)}
th .req{vertical-align:middle}
tr.dragging{opacity:.35}
tr.over td{box-shadow:inset 0 2px 0 var(--accent)}
.rowbtn{background:transparent;border:1px solid var(--border);color:var(--text3);
  width:24px;height:24px;border-radius:var(--r3);cursor:pointer;font-size:12px;
  display:grid;place-items:center;transition:.14s;flex-shrink:0}
.rowbtn:hover{color:var(--req);border-color:var(--req)}
.rowbtn.grip{cursor:grab;color:var(--text3);font-size:11px}
.addrow{display:flex;gap:8px;margin-bottom:18px}

/* ============ 图片槽 ============
   v1.5 改造要点（对应第四批需求 2）：
   1) 完整展示不裁切 —— 原 height:60px + object-fit:cover 会裁掉画面上下，
      改为按宽高比自适应高度 + contain。
   2) 排列整齐 —— 参考图是「排布用」而非终点（终点是导出 PDF/DOCX），
      故槽位统一按 4:3 基准格渲染，同一槽内所有图尺寸一致、网格对齐，
      不同宽高比的图也强制塞进同一比例的格子，视觉上整齐划一。
   3) 删除按钮常驻 —— 原 .rm 只在 hover 时显示（opacity:0），
      触屏与打印场景根本点不到；改为常驻半透明黑底白✕，hover 加深。 */
.pick{width:100%;min-width:74px;aspect-ratio:4/3;border:1.5px dashed var(--border);
  border-radius:var(--r2);background:var(--panel2);cursor:pointer;
  display:grid;place-items:center;transition:.15s;overflow:hidden;position:relative}
.pick:hover{border-color:var(--accent);background:var(--accent-bg)}
.pick .ph{font-size:19px;color:var(--text3);line-height:1}
.pick .lb{font-size:9px;color:var(--text3);margin-top:2px}
.pick.filled{border-style:solid;border-color:var(--accent);padding:0}
/* contain 保证完整显示；图片宽高比与格子不符时留白而非裁切 */
.pick.filled img{width:100%;height:100%;object-fit:contain;display:block;
  background:var(--panel2)}
/* 常驻删除按钮：不用 hover 触发，触屏/打印都能点 */
.pick .rm{position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:50%;
  background:rgba(0,0,0,.58);color:#fff;border:none;cursor:pointer;font-size:12px;
  display:grid;place-items:center;opacity:1;transition:.15s;line-height:1;
  font-weight:700;z-index:2}
.pick .rm:hover{background:rgba(198,40,40,.94);transform:scale(1.12)}
.pick.drop{border-color:var(--accent);background:var(--accent-bg);border-style:solid}

/* ============ §7 行程时段轴（甘特式）============ */
.tl{position:relative;height:64px;margin:26px 0 8px;border-radius:var(--r2);
  background:var(--panel2);border:1px solid var(--border)}
.tl-scale{position:absolute;inset:0;pointer-events:none}
.tl-scale span{position:absolute;top:3px;transform:translateX(-50%);
  font-size:10px;color:var(--text3);font-family:var(--fm)}
.tl-scale span::after{content:'';position:absolute;left:50%;top:16px;width:1px;height:46px;
  background:var(--border);opacity:.55}
.tl-b{position:absolute;top:22px;transform:translateX(-50%);white-space:nowrap;
  display:flex;flex-direction:column;align-items:center;gap:1px;
  padding:4px 9px;border-radius:15px;border:1.5px solid var(--c);
  background:var(--panel);cursor:pointer;transition:.15s;font-family:inherit}
.tl-b b{font-size:11.5px;color:var(--text);line-height:1.2}
.tl-b i{font-size:9.5px;color:var(--c);font-style:normal;font-family:var(--fm)}
.tl-b:hover{background:var(--accent-bg);transform:translateX(-50%) scale(1.06)}
.tl-b::before{content:'';position:absolute;left:50%;bottom:-9px;transform:translateX(-50%);
  border-left:4px solid transparent;border-right:4px solid transparent;
  border-top:5px solid var(--c)}
/* 窄屏时时段轴横向滚动，避免按钮互相重叠 */
@media(max-width:760px){.tl{overflow-x:auto;min-width:520px}}
/* 打印时删除按钮隐藏（PDF 里出现 ✕ 符号是噪音），但保留图片完整展示 */
@media print{
  .pick{aspect-ratio:auto;height:auto;min-height:0}
  .pick.filled img{max-height:42mm;object-fit:contain}
}

/* ============ 复选 / 计算器 / 灯箱 ============ */
.ck{display:flex;align-items:flex-start;gap:7px;font-size:12.5px;
  color:var(--text2);cursor:pointer;padding:5px 0;line-height:1.5}
.ck input{width:auto;min-width:0;flex-shrink:0;margin-top:2px;cursor:pointer;
  accent-color:var(--accent)}
.calc{background:var(--accent-bg);border:1px solid var(--accent);border-radius:var(--r2);
  padding:12px 14px;margin:10px 0}
.calc .ct{font-size:11px;color:var(--accent);font-weight:600;margin-bottom:8px;
  display:flex;align-items:center;gap:6px}
.calc .cf{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end}
.calc .cf .f{flex:1;min-width:82px}
.calc .cf input{background:var(--panel)}
.calc .co{font-size:12.5px;margin-top:10px;padding-top:9px;
  border-top:1px dashed var(--border);color:var(--text2)}
.calc .co b{color:var(--accent);font-size:16px;font-variant-numeric:tabular-nums;
  margin:0 3px}
.calc .fx{font-family:var(--fm);font-size:10.5px;color:var(--text3);margin-top:5px}

#lb{display:none;position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:9999;
  place-items:center;cursor:zoom-out;padding:26px}
#lb.on{display:grid}
#lb img{max-width:94vw;max-height:92vh;border-radius:var(--r2);
  box-shadow:0 20px 70px rgba(0,0,0,.6)}

/* 占位 */
.ph-box{background:var(--ph);border:1px dashed var(--border);border-radius:var(--r2);
  padding:22px;text-align:center;color:var(--text3);font-size:12.5px}
.ph-box b{display:block;color:var(--text2);font-size:13px;margin-bottom:5px;font-weight:500}

.note{font-size:11.5px;color:var(--text2);background:var(--panel2);
  border-left:3px solid var(--accent);border-radius:0 var(--r2) var(--r2) 0;
  padding:10px 13px;margin:12px 0}
.warn{border-left-color:var(--amber)}
.ok{color:var(--green)}

.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:9998;display:none;
  place-items:center;padding:26px}
.modal.on{display:grid}
.modal-c{background:var(--panel);border:1px solid var(--border);border-radius:var(--r);
  max-width:540px;width:100%;padding:24px 26px;box-shadow:0 20px 60px rgba(0,0,0,.3);
  max-height:86vh;overflow-y:auto}
.modal-c h3{margin:0 0 4px;font-size:15px}
.modal-c h3::before{display:none}
.miss-list{max-height:270px;overflow-y:auto;margin:14px 0;padding:11px;
  background:var(--ph);border-radius:var(--r2);font-size:12.5px}
.miss-list div{padding:3px 0;color:var(--text2)}
.miss-list b{color:var(--req)}
.modal-f{display:flex;gap:9px;justify-content:flex-end}

/* 模式态 */
body[data-mode="check"] .f input,body[data-mode="check"] .f select,
body[data-mode="check"] .f textarea{
  background:transparent;border-color:transparent;pointer-events:none}
body[data-mode="check"] .f input:focus{outline:none}
/* 核对态只隐藏「编辑类控件」：增删行按钮 + 纸张/导出按钮。
   绝不能隐藏模式切换器 #modeSeg —— 否则进入核对态后无法切回编辑态
   （这是Playwright 实测抓到的真bug）。*/
body[data-mode="check"] .addrow,
body[data-mode="check"] .rowbtn,
body[data-mode="check"] .pick .rm,
body[data-mode="check"] #paper,
body[data-mode="check"] #pdfBtn,
body[data-mode="check"] #docxBtn,
body[data-mode="check"] #zipBtn{display:none}
body[data-mode="check"] .ck input{pointer-events:auto}
body[data-mode="check"] .sec-h h2::after{content:" · 核对态";
  font-size:10px;color:var(--amber);font-weight:400}

/* ============ 打印 ============ */
@media print{
  html[data-theme="light"],html[data-theme="dark"]{
    --bg:#fff;--panel:#fff;--panel2:#fff;--border:#bbb;--ph:#fff;
    --text:#000;--text2:#333;--text3:#666;--accent:#000;--accent-bg:#fff
  }
  @page{size:A4 portrait;margin:14mm 12mm}
  .top,.side,.addrow,.rowbtn,.tools,.modal,#lb,.no-print{display:none!important}
  .shell{display:block;max-width:none}
  .main{padding:0}
  .sec{break-inside:avoid-page;page-break-inside:avoid;border:1px solid #ccc;
    margin:0 0 10pt;padding:12pt;box-shadow:none;border-radius:0}
  .sec-d{display:none}
  table{min-width:0;font-size:9pt}
  th{background:#f0f0f0!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  tr,td{break-inside:avoid}
  .pick{border-color:#999!important;height:44px;min-width:56px}
  .pick .rm{display:none}
  input,textarea,select{border:transparent!important;background:transparent!important;
    padding:2px 0!important;font-size:9pt}
  .calc{background:#f6f6f6!important;border-color:#999;
    -webkit-print-color-adjust:exact;print-color-adjust:exact}
  .badge{border:1px solid #999!important;color:#000!important;background:none!important}
}
</style>
</head>
<body data-mode="edit">

<div class="top"><div class="top-in">
  <div class="brand">
    <div class="logo">📷</div>
    <div>
      <h1>拍摄策划工作台</h1>
      <div class="sub">T1-1 模板 v3.0 · 13 节 · 原型 v0.1</div>
    </div>
  </div>

  <div class="prog">
    <div class="prog-hd"><span>强制项完成度</span><b id="pTxt">0 / 32</b></div>
    <div class="bar"><i id="pBar" style="width:0%"></i></div>
  </div>

  <div class="tools">
    <div class="seg no-check" id="modeSeg">
      <button class="on" data-m="edit">编辑</button>
      <button data-m="preview">预览</button>
      <button data-m="check">核对</button>
    </div>
    <select id="paper" class="btn no-check" style="padding:6px 9px">
      <option value="A4 portrait">A4 纵向</option>
      <option value="A4 landscape">A4 横向</option>
    </select>
    <button class="btn" id="tBtn" title="仅切换 token 值，组件样式不变">☀ 浅色</button>
    <button class="btn pri" id="pdfBtn">导出 PDF</button>
    <button class="btn pri" id="docxBtn">导出 DOCX</button>
    <button class="btn" id="zipBtn" title="原型阶段未接入 JSZip">导出 zip</button>
  </div>
</div></div>

<div class="shell">
  <aside class="side">
    <div class="side-t">章节导航</div>
    <nav class="nav" id="nav"></nav>
    <div style="padding:16px 8px 0">
      <button class="btn sm" id="clrBtn" style="width:100%">清空全部数据</button>
      <button class="btn sm" id="libBtn" disabled
        style="width:100%;margin-top:6px;opacity:.5;cursor:not-allowed"
        title="v2 预留接口：WorkBuddy 资料库同步">🔗 同步到资料库</button>
      <div style="font-size:10px;color:var(--text3);margin-top:6px;text-align:center">
        v2 预留 · 置灰
      </div>
    </div>
  </aside>

  <main class="main" id="main"></main>
</div>

<div id="lb"><img alt=""></div>

<div class="modal" id="modal"><div class="modal-c">

/* 图片压缩 → dataURL */
async function shrink(file,max=1600,q=.85){
  const bmp=await createImageBitmap(file);
  let{width:w,height:h}=bmp;
  const sc=Math.min(1,max/Math.max(w,h));
  w=Math.round(w*sc); h=Math.round(h*sc);
  const c=document.createElement('canvas'); c.width=w; c.height=h;
  c.getContext('2d').drawImage(bmp,0,0,w,h);
  const url=c.toDataURL('image/jpeg',q);
  return {url,w,h,size:Math.round(url.length*.75)};
}
async function hash(s){
  const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));
  return [...new Uint8Array(b)].slice(0,8).map(x=>x.toString(16).padStart(2,'0')).join('');
}

function pickHTML(id,val){
  return `<div class="pick ${val?'filled':''}" data-pick="${id}"

    ${val?`<img src="${val}" alt="">
      <button class="rm" data-rm="${id}" title="移除">✕</button>`
         :`<div><div class="ph">⬒</div><div class="lb">点击/拖入</div></div>`}
    <input type="file" accept="image/*" hidden data-fi="${id}">
  </div>`;
}
async function setPick(id,file){
  if(!file||!file.type.startsWith('image/')){ toast('请选择图片文件'); return; }
  const {url,w,h,size}=await shrink(file);
  ASSETS[id]={mime:'image/jpeg',w,h,size,uploadedAt:new Date().toISOString()};
  setByPath(id,url); save(); render();
  toast('图片已嵌入该字段（长边压至 '+Math.max(w,h)+'px）');
}
/* v1.5：把图片写入「数组字段」的指定槽位。
   区别于 setPick()——后者是标量字段（整字段只有一张图，替换即可）。
   数组字段（如 §1 模特样图 1-2 张、§11 参考样片 5-25 张）需要：
   ① 按 id 末段的索引定位；② 越界时追加而非替换；③ 容量上限校验。
   idx 为 null时表示「追加到末尾」。 */
async function setPickArr(key,arr,idx,file,max){
  if(!file||!file.type.startsWith('image/')){ toast('请选择图片文件'); return false; }
  if(arr.length>=max && (idx===null||idx>=arr.length)){
    toast('最多 '+max+' 张，已达上限'); return false; }
  const {url,w,h,size}=await shrink(file);
  ASSETS[key+(idx===null?arr.length:idx)]={mime:'image/jpeg',w,h,size,
    uploadedAt:new Date().toISOString()};
  if(idx===null||idx>=arr.length) arr.push(url); else arr[idx]=url;
  return true;
}

/* 路径格式：
   len2 "0.编号" / "4.名称" / "65.图" / "10.人" → 标量
   len3 "3.妆.风" / "3.发.图"                 → §3 两个对象
   len4 "2.服装.0.款" / "65.灯位.0.具" / "10.风.0.触" → 行数组 */
function rowArr(sec,a){
  if(sec==='2')  return a==='配饰'?D.s2.配饰[0]:D.s2.服装;
  if(sec==='65') return D.s65.灯位[0];
  if(sec==='10') return D.s10.风[0];
  if(sec==='5')  return D.s5.道具;     /* v1.5 §5 道具清单 */
  if(sec==='6')  return D.s6[a]||null;  /* v1.5 §6 器材/滤镜/灯/附件 四子表 */
  if(sec==='7')  return D.s7.行||null;     /* v1.6 §7 timetable 行数组 */
  return null;
}
function boxOf(sec){
  return sec==='0'?D.s0 : sec==='1'?D.s1 : sec==='4'?D.s4
       : sec==='5'?D.s5 : sec==='6'?D.s6 : sec==='11'?D.s11   /* v1.5 新增 §5/§6/§11 */
       : sec==='7'?D.s7                                          /* v1.6 新增 §7 行程 */
       : sec==='65'?D.s65 : sec==='10'?D.s10 : null;
}
function setByPath(path,val){
  const p=path.split('.');
  if(p.length===4){ const arr=rowArr(p[0],p[1]); if(arr) arr[+p[2]][p[3]]=val; return; }
  if(p.length===3){ (p[1]==='发'?D.s3.发:D.s3.妆)[p[2]]=val; return; }
  const b=boxOf(p[0]); if(b) b[p[1]]=val;
}
function getByPath(path){
  const p=path.split('.');
  if(p.length===4){ const arr=rowArr(p[0],p[1]); return arr?arr[+p[2]][p[3]]:''; }
  if(p.length===3) return (p[1]==='发'?D.s3.发:D.s3.妆)[p[2]];
  const b=boxOf(p[0]); return b?b[p[1]]:'';
}

function fld(label,val,path,opt={}){
  const miss=opt.req&&REQ(val);
  let ctl;
  if(opt.type==='select')
    ctl=`<select data-p="${path}" data-req="${opt.req?1:0}" class="${miss?'err':''}">
      <option value="">— 请选择 —</option>
      ${(opt.opts||[]).map(o=>`<option ${o===val?'selected':''}>${esc(o)}</option>`).join('')}</select>`;
  else if(opt.type==='textarea')
    ctl=`<textarea data-p="${path}" data-req="${opt.req?1:0}" class="${miss?'err':''}"
      placeholder="${esc(opt.ph||'')}">${esc(val)}</textarea>`;
  else
    ctl=`<input type="${opt.type||'text'}" data-p="${path}" data-req="${opt.req?1:0}"
      value="${esc(val)}"
      class="${miss?'err':''}" placeholder="${esc(opt.ph||'')}">`;
  return `<div class="f">
    <label>${label}${opt.req?'<span class="req" title="强制项">*</span>':''}${
      opt.rec?'<span class="rec">推荐</span>':''}</label>
    ${ctl}
    ${miss?`<div class="miss">⚠ 强制项未填</div>`:''}
    ${opt.hint?`<div class="hint">${esc(opt.hint)}</div>`:''}
  </div>`;
}
/* 强制项红框 + 「⚠ 强制项未填」提示的<b>双向</b>同步：
   填上→ 撤红框与提示；删空 → 恢复红框与提示。
   两者是独立节点（.err 在控件上、.miss 是同级 div），必须成对处理，
   只撤 class 会让文字提示留在页面上误导决策。 */
function syncMiss(el){
  if(!el.dataset.req) return;          // 非强制项字段不参与
  const box=el.closest('.f'); if(!box) return;
  const empty=REQ(el.value);
  el.classList.toggle('err', empty);
  const m=box.querySelector('.miss');
  if(empty && !m) box.insertBefore(
    Object.assign(document.createElement('div'),{className:'miss',textContent:'⚠ 强制项未填'}),
    box.querySelector('.hint')||null);
  else if(!empty && m) m.remove();
}
function ck(label,on,path){
  return `<label class="ck"><input type="checkbox" data-p="${path}" ${on?'checked':''}>
    <span>${label}</span></label>`;
}

    ${req?'<span class="badge b-rec">含强制项</span>':''}</div>`;
}

/* ==========================================================================
   §7 行程安排（v1.6 从占位做实）
   --------------------------------------------------------------------------
   口径确认：只做 timetable 管理模型，**不做人员分工**。
   三个能力：
     7.1 时段轴 —— 拍摄日的典型时段带（甘特式），点选即填入下方表格的起始时间
     7.2 timetable 表 —— 时间 / 事项 / 地点 / 耗时 / 备注，可增删行
     7.3 汇总校验 —— 自动累计耗时，与 §0.2「预计时长」比对，超时给提醒
   ========================================================================== */
/* 把 HH:MM 转成分钟，便于在时段轴上换算位置 */
function t2m(t){
  const x=String(t||'').match(/^(\d{1,2}):(\d{2})$/);
  return x? (+x[1])*60+(+x[2]) : null;
}
function sec7(){
  const arr=D.s7.行;
  const total=arr.reduce((s,r)=>s+(+r.耗时||0),0);
  const plan=+D.s0.时长||0;
  /* 甘特轴：按 07:00–21:00 铺满，标出各时段位置 */
  const T0=7*60, T1=21*60, span=T1-T0;
  const bandOf=t=>{ const m=t2m(t); return m==null? null
    : Math.max(0, Math.min(100,(m-T0)/span*100)); };
  return `<section class="sec" id="sec-7">
  ${secHead('7','行程安排',true,true)}
  <div class="sec-d">拍摄当天的<b>时间管理</b>。先在下方的时段带上点出关键节点，
  再按实际进度补全 timetable。<b>人员分工不在本节范围内。</b></div>

  <h3>7.1 拍摄日时段轴<span class="rec" style="color:var(--amber)">点击填入起始时间</span></h3>
  <div class="tl">
    <div class="tl-scale">${['07:00','10:00','13:00','16:00','19:00','21:00']
      .map(t=>`<span style="left:${bandOf(t)}%">${t}</span>`).join('')}</div>
    ${S7_SLOTS.map(s=>`<button class="tl-b" data-slot="${s.k}"
      style="left:${bandOf(s.t)}%;--c:${s.c}" title="${esc(s.tip)}">
      <b>${esc(s.k)}</b><i>${s.t}</i></button>`).join('')}
  </div>
  <div class="hint">★ 标记的<b>黄金时刻</b>与<b>日落</b>是拍摄日最不可错过的两段，
  反向光、逆光剪影、氛围片都靠这两段。具体日落时刻随纬度与日期变化
  （冬季日落早约 1 小时），<b>以拍摄地当日实测为准</b>。</div>

  <h3>7.2 Timetable<span class="rec" style="color:var(--blue)">${arr.length} 项</span></h3>
  <div class="tbl-wrap"><table>
    <thead><tr>
      <th style="width:86px">开始时间<span class="req">*</span></th>
      <th style="width:26%">事项<span class="req">*</span></th>
      <th style="width:18%">地点</th>
      <th style="width:78px">耗时(分)</th>
      <th>备注</th>
      <th style="width:44px"></th>
    </tr></thead>
    <tbody>${arr.map((r,i)=>`<tr>
      <td><input type="time" data-p="7.行.${i}.时" value="${esc(r.时)}"></td>
      <td><input data-p="7.行.${i}.事" value="${esc(r.事)}" placeholder="例：拍摄 · 逆光组"></td>
      <td><input data-p="7.行.${i}.地" value="${esc(r.地)}" placeholder="例：沙面公园东门"></td>
      <td><input type="number" min="0" step="5" data-p="7.行.${i}.耗时" value="${esc(r.耗时??'')}"></td>
      <td><input data-p="7.行.${i}.备" value="${esc(r.备)}" placeholder="例：模特换第二套服装"></td>
      <td><button class="rowbtn" data-del="行程.${i}" title="删除该行">✕</button></td>
    </tr>`).join('')}</tbody>
  </table></div>
  <div class="addrow no-print" style="margin-top:9px">
    <button class="btn sm" data-add="行程">＋ 添加时段</button>
  </div>

  <h3>7.3 耗时汇总</h3>
  <div class="grid g3">
    <div class="f">
      <label>已排时长</label>
      <div style="padding:9px 0;font-family:var(--fm);font-size:16px;font-weight:600;
        color:var(--accent)">${total} 分钟
        <span style="font-size:12px;color:var(--text3);font-weight:400">
          （${(total/60).toFixed(1)} 小时）</span></div>
      <div class="hint">由各行「耗时」自动累加</div>
    </div>
    <div class="f">
      <label>§0.2 预计时长</label>
      <div style="padding:9px 0;font-size:16px;font-weight:600">
        ${plan? plan+' 分钟' : '<span style="color:var(--muted)">未填</span>'}</div>
      <div class="hint">含妆造与换装，不含路程</div>
    </div>
    <div class="f">
      <label>差异</label>
      ${(()=>{
        if(!plan||!total) return '<div style="padding:9px 0;font-size:13px;color:var(--muted)">填齐两边后自动比对</div>';
        const d=total-plan;
        return Math.abs(d)<=10
          ? `<div style="padding:9px 0;font-size:15px;font-weight:600;color:var(--green)">✓ 基本吻合</div>
             <div class="hint">排期与预计相差 ${Math.abs(d)} 分钟，在合理范围内</div>`
          : `<div style="padding:9px 0;font-size:15px;font-weight:600;color:${d>0?'var(--red)':'var(--amber)'}">
               ${d>0?'超出':'缺口'} ${Math.abs(d)} 分钟</div>
             <div class="hint">${d>0?'考虑精简拍摄组数或延长拍摄时段':'考虑补齐安排或上调 §0.2 预计时长'}</div>`;
      })()}
    </div>
  </div>
  </section>`;
}

/* ==========================================================================
   7. 侧边栏 + 完成度
   ========================================================================== */
function navRender(){
  const done=doneSet(), ALL=reqAll();
  const per={};
  ALL.forEach(([sec,k])=>{
    per[sec]=per[sec]||{d:0,t:0}; per[sec].t++;      /* 分母=必填项总数 */
    if(done.has(sec+'-'+k)) per[sec].d++;
  });
  $('#nav').innerHTML = SECS.map(s=>{
    const p=per[s.id]; let cls='',st='';
    if(p){ const r=p.d/p.t;
      st=p.d+'/'+p.t; cls = r>=1?'done':(p.d>0?'part':''); }
    return `<a href="#sec-${s.id}" class="${cls} ${s.id===cur?'on':''}">
      <span>${esc(s.t)}</span>${s.core?'<span class="st" style="color:var(--accent)">◆</span>':''}
      <span class="st">${st}</span></a>`;
  }).join('');
}
let cur='0';
function updProg(){
  const done=doneSet(), ALL=reqAll();
  const t=ALL.length, d=ALL.filter(x=>done.has(x[0]+'-'+x[1])).length;
  $('#pTxt').textContent = d+' / '+t;
  $('#pBar').style.width = (t?d/t*100:0)+'%';
}

   8. 事件
   ========================================================================== */
/* input 事件：立即更新「强制项红框」与派生提示（如拍摄日星期、总功率），
   但不整体重渲染——否则输入框会失焦 */
function patchLive(el){
  const p=el.dataset.p; if(!p) return;
  /* 1. 字段红框 + 「⚠ 强制项未填」提示。
     注意：红框与提示是**两个独立节点**（.err 在控件上、.miss 是同级 div），
     只remove('err') 会让文字提示留在页面上——用户填完了还看到「强制项未填」，
     属于会误导决策的显示缺陷，故必须成对清除。 */
  if(el.classList.contains('err') && !REQ(el.value)) el.classList.remove('err');
  /* 1b. 强制项红框与「⚠ 强制项未填」提示双向同步（填上撤、删空恢复）。
     注意：红框与提示是两个独立节点（.err 在控件上、.miss 是同级 div），
     只 remove('err') 会让文字提示留在页面上——用户填完了还看到「强制项未填」，
     属于会误导决策的显示缺陷，故必须成对处理。 */
  syncMiss(el);
  /* 2. 派生提示 */
  if(p==='0.拍摄日期'){
    const box=el.closest('.f'); const hint=box&&box.querySelector('.hint');
    if(hint) hint.textContent = wk() ? ('拍摄日：'+wk()) : '填入后自动显示星期';
  }
  /* 3. §6.5 灯位：填了值就撤红框；并重算总功率 */
  const m=p.match(/^65\.灯位\.(\d+)\.(具|数|瓦|控数|电|方向)$/);
  if(m){ const k=m[2]==='具'?'具':m[2];
    document.querySelectorAll('[data-p="65.灯位.'+m[1]+'.'+k+'"]')
      .forEach(x=>x.classList.remove('err')); }
  if(/^65\.灯位\.\d+\.(瓦|数)$/.test(p)) updPower();
  /* 4. 总功率：用户手改后停止自动覆盖；清空则恢复自动并立即重算
        注意 REQ(v) 语义为「是否为空」：true=空，false=有值 */
  if(p==='65.总功率'){
    if(REQ(el.value)){ D.s65._pwAuto=true; updPower(); }   // 清空 → 恢复自动
    else              D.s65._pwAuto=false;                 // 手改 → 锁定
  }
}
/* 总功率 = Σ(功率 × 数量)
   注意：必须写回 D，不能只写 DOM —— 否则下一次 render() 会把手填结果冲掉。
   _pwAuto 为 true 表示「自动值」，用户手改后置false，停止自动覆盖。*/
function totalW(){
  return D.s65.灯位[0].reduce((s,r)=>{
    const w=parseFloat(r.瓦), n=parseFloat(r.数);
    return s+(isFinite(w)?w:0)*(isFinite(n)?n:0);
  },0);
}
function updPower(){
  if(D.s65._pwAuto===false) return;          // 用户已手改，不再自动覆盖
  const t=totalW();
  D.s65.总功率 = t?String(Math.round(t)):'';// 写回数据层
  const el=document.querySelector('[data-p="65.总功率"]');
  if(el) el.value = D.s65.总功率;
}
document.addEventListener('input',e=>{
  const p=e.target.dataset.p; if(!p) return;
  if(e.target.type==='radio'&&!e.target.checked) return;   // 单选：只响应选中项
  const v=e.target.type==='checkbox'||e.target.type==='radio'
    ? (e.target.type==='radio'?e.target.value:e.target.checked)
    : e.target.value;
  setByPath(p,v); save();
  patchLive(e.target);
  updProg();
});
document.addEventListener('change',e=>{
  const p=e.target.dataset.p; if(!p) return;
  if(e.target.type==='radio'&&!e.target.checked) return;
  const v=e.target.type==='radio'?e.target.value
    : (e.target.type==='checkbox'?e.target.checked:e.target.value);
  setByPath(p,v); save();
  /* 注：原「§0.3 选场地库 → 带入地点」与「§0.7 选模特库 → 调出 §1 档案」两处联动
     已随第四批需求 1（下线两个下拉）一并移除。
     场地主数据源仍是 §4 场地库、模特主数据源仍是 §1 模特档案，
     但改由用户在对应章节内直接维护，不再从 §0 反向选择。 */
  if(e.target.type==='radio'||e.target.tagName==='SELECT') render(); else patchLive(e.target);
  updProg();
});

/* 图片：点击 /拖拽 */
document.addEventListener('click',async e=>{
  const rm=e.target.closest('[data-rm]');
  if(rm){ const id=rm.dataset.rm;
    /* §4 场地参考图为数组：4.图.N → 删除第 N 张 */
    const mv=id.match(/^4\.图\.(\d+)$/);
    if(mv){ D.s4.图.splice(+mv[1],1); save(); render();
      toast('已移除该图（剩余 '+D.s4.图.length+'/10）'); return; }
    /* v1.5 §1 模特样图为数组：1.样图.N → 删除第 N 张 */
    const ms=id.match(/^1\.样图\.(\d+)$/);
    if(ms){ D.s1.样图=D.s1.样图||[]; D.s1.样图.splice(+ms[1],1); save(); render();
      toast('已移除该图（剩余 '+D.s1.样图.length+'/2）'); return; }
    /* v1.5 §5 道具参考图为数组：5.图.N → 删除第 N 张 */
    const mp5=id.match(/^5\.图\.(\d+)$/);
    if(mp5){ D.s5.图.splice(+mp5[1],1); save(); render();
      toast('已移除该图（剩余 '+D.s5.图.length+'/8）'); return; }
    /* v1.5 §11 参考样片为数组：11.样片.N → 删除第 N 张 */
    const mp=id.match(/^11\.样片\.(\d+)$/);
    if(mp){ D.s11.样片=D.s11.样片||[]; D.s11.样片.splice(+mp[1],1); save(); render();
      toast('已移除该图（剩余 '+D.s11.样片.length+'/'+S11_MAX+'）'); return; }
    setByPath(id,''); save(); render();
    toast('已移除该图'); return; }
  const pk=e.target.closest('[data-pick]');
  if(pk&&!e.target.closest('[data-rm]')){ pk.querySelector('input').click(); return; }
  const im=e.target.closest('.pick.filled img');
  if(im){ $('#lb img').src=im.src; $('#lb').classList.add('on'); return; }

  const add=e.target.closest('[data-add]');
  if(add){ const k=add.dataset.add;
    let blank;
    if(k==='配饰')        blank={类:'',具:'',必:false,图:''};
    else if(k==='服装')   blank={类:'',品:'',款:'',质:'',色:'',图:''};
    else if(k==='灯位')   blank={灯位名:'辅光',方向:'',方向自定义:'',具:'',数:'',瓦:'',
                                  电:'',控:'',控数:'',用:''};
    else if(k==='道具')   blank={名:'',类:'拍摄道具',数:'1',备:''};
    else if(k==='行程')   blank={时:'09:00',事:'',地:'',耗时:60,备:''};
    else                  blank={类:'',品:'',款:'',质:'',色:'',图:''};
    const arr=arrOf(k);
    arr.push(blank); save(); render(); return; }

  /* §7 行程安排（v1.6）：点时段轴上的关键节点 → 填入首行开始时间。
     语义是「把该节点设为行程起点」，比让用户手打时间更省事。 */
  const slot=e.target.closest('[data-slot]');
  if(slot){
    const k=slot.dataset.slot;
    const s=S7_SLOTS.find(x=>x.k===k); if(!s) return;
    if(!(D.s7.行||[]).length) D.s7.行.push({时:s.t,事:s.k,地:'',耗时:60,备:s.tip});
    else D.s7.行[0].时=s.t;
    save(); render();
    toast('已将「'+k+'」'+s.t+' 设为行程起点\n'+(D.s7.行.length===1?'（当前只有 1 行，可继续「＋ 添加时段」）':''));
    return; }

  /* §6 器材四表：新增行（data-addge="器材|滤镜|灯|附件"） */
  const addge=e.target.closest('[data-addge]');
  if(addge){ const k=addge.dataset.addge;
    D.s6[k].push({品:'',型:'',数:'1',备:''});
    save(); render();
    toast('已添加一行'); return; }
  /* §6 器材四表：删除行（data-delge="器材.0"） */
  const delge=e.target.closest('[data-delge]');
  if(delge){ const [k,i]=delge.dataset.delge.split('.');
    D.s6[k].splice(+i,1); save(); render();
    toast('已删除该行'); return; }

  const delrow=e.target.closest('[data-delrow]');
  if(delrow){ const k=delrow.dataset.delrow;
    const arr=arrOf(k);
    if(arr.length>1){ arr.pop(); save(); render();
      toast('已删除末行'); } return; }

  const del=e.target.closest('[data-del]');
  if(del){ const [k,i]=del.dataset.del.split('.');
    const arr=arrOf(k);
    if(arr.length<=1){ toast('至少保留一行'); return; }
    arr.splice(i,1); save(); render();
    toast('已删除该行'); return; }

  /* 注：原 §0.3「§4 详情」与 §0.7「§1 详情」两个跳转按钮已随第四批需求 1 一并下线，
     对应的 toV1 / toV4 处理分支随之移除（按钮不存在则分支永不触发，属死代码）。 */

  /* ---- 模特库 ---- */
  if(e.target.id==='saveModel'){
    if(REQ(D.s1.姓名)){ toast('请先填写模特姓名'); $('#sec-1').scrollIntoView({behavior:'smooth'}); return; }
    const i=MODELS.findIndex(x=>x.姓名===D.s1.姓名);
    const rec={姓名:D.s1.姓名, 身高:D.s1.身高, 体重:D.s1.体重,
               样图:[...(D.s1.样图||[])], 备注:D.s1.备注,
               updatedAt:new Date().toISOString()};
    if(i>=0){ rec.createdAt=MODELS[i].createdAt; MODELS[i]=rec;
      toast('已更新模特库中的「'+rec.姓名+'」'); }
    else { rec.createdAt=rec.updatedAt; MODELS.push(rec);
      toast('已存入模特库（'+MODELS.length+' 位）· 之后可在 §1 档案中选用'); }
    saveModels(); save(); render(); return;
  }
  const mload=e.target.closest('[data-mload]');
  if(mload){ const m=MODELS.find(x=>x.姓名===mload.dataset.mload); if(!m) return;
    Object.assign(D.s1,{姓名:m.姓名,身高:m.身高,体重:m.体重,
      样图:[...(m.样图||[])],备注:m.备注});
    D.s0.模特=m.姓名; save(); render();
    toast('已调入模特「'+m.姓名+'」的档案，并同步到 §0.7'); return; }
  const mdel=e.target.closest('[data-mdel]');
  if(mdel){ const n=mdel.dataset.mdel;
    if(!confirm('从模特库移除「'+n+'」？\n本策划案已填内容不受影响。')) return;
    MODELS=MODELS.filter(x=>x.姓名!==n); saveModels(); render();
    toast('已从模特库移除'); return; }
  if(e.target.id==='csvModels'){ exportCSV('models'); return; }
  if(e.target.id==='toFeishu'){ feishuStub('模特信息表'); return; }

  /* ---- 场地库 ---- */
  if(e.target.id==='saveVenue'){
    if(REQ(D.s4.名称)){ toast('请先填写场地名称'); $('#sec-4').scrollIntoView({behavior:'smooth'}); return; }
    const id=D.s4.场地Id||('VD'+String(++_venueSeq).padStart(3,'0'));
    const i=VENUES.findIndex(x=>x.id===id);
    const rec={id, 名称:D.s4.名称, 所在区:D.s4.所在区,
               适配风格:D.s4.适配风格, 时效性:D.s4.时效性, 门票:D.s4.门票,
               简述:D.s4.简述, 图:[...(D.s4.图||[])], 备注:D.s4.备注,
               updatedAt:new Date().toISOString()};
    if(i>=0){ rec.createdAt=VENUES[i].createdAt; VENUES[i]=rec;
      toast('已更新场地库中的「'+rec.名称+'」'); }
    else { rec.createdAt=rec.updatedAt; VENUES.push(rec);
      toast('已存入场地库（'+VENUES.length+' 处）· 可在 §0.3 选用'); }
    D.s4.场地Id=id; saveVenues(); save(); render(); return;
  }
  const vload=e.target.closest('[data-vload]');
  if(vload){ const v=VENUES.find(x=>x.id===vload.dataset.vload); if(!v) return;
    Object.assign(D.s4,{场地Id:v.id,名称:v.名称,所在区:v.所在区,
      适配风格:v.适配风格,时效性:v.时效性,门票:v.门票,简述:v.简述,
      图:[...(v.图||[])],备注:v.备注||''});
    /* v1.5：§0.3 已下线「从场地库选择」下拉，故不再写 D.s0.场地Id；
       改为把名称与所在区分别带入 §0.3 的两个文字字段（可手工微调）。 */
    D.s0.地点=v.名称||'';
    D.s0.场地所在区=v.所在区||'';
    save(); render();
    toast('已调入场地「'+v.名称+'」并同步到 §0.3 拍摄地点'); return; }
  const vdel=e.target.closest('[data-vdel]');
  if(vdel){ const id=vdel.dataset.vdel, v=VENUES.find(x=>x.id===id);
    if(!confirm('从场地库移除「'+(v?v.名称:id)+'」？\n本策划案已填内容不受影响。')) return;
    VENUES=VENUES.filter(x=>x.id!==id); saveVenues(); render();
    toast('已从场地库移除'); return; }
  if(e.target.id==='csvVenues'){ exportCSV('venues'); return; }
  if(e.target.id==='toFeishuV'){ feishuStub('拍摄场地表'); return; }

  /* 编号分配 */
  if(e.target.id==='allocBtn'){
    const base=D.s0.撰写日期||D.s0.拍摄日期||'';
    if(D.s0.编号){
      const m=String(D.s0.编号).match(/^(CX-\d{8})-(\d+)$/);
      if(!confirm('重新分配将释放当前编号 '+D.s0.编号+'，确定？')) return;
      if(m) AUTO_NO.release(m[1], +m[2]);
      D.s0.编号='';
    }
    const x=AUTO_NO.next(base);
    D.s0.编号=x.no; AUTO_NO.reserve(x.key,x.seq);
    save(); render();
    toast('已分配策划案编号 '+x.no+'\n归档目录：'+folderName()+'\n文件名：'+archiveName());
    return;
  }
});
/* 行数组统一取用入口 */
function arrOf(k){
  if(k==='配饰') return D.s2.配饰[0];
  if(k==='灯位') return D.s65.灯位[0];
  if(k==='道具') return D.s5.道具;   /* v1.5 §5 道具清单 */
  if(k==='行程') return D.s7.行;      /* v1.6 §7 timetable 行数组 */
  /* v1.5 §6 摄影器材四子表（器材/滤镜/灯/附件） */
  if(['器材','滤镜','灯','附件'].includes(k)) return D.s6[k];
  return D.s2[k];
}
/* ---- 预留接口：CSV 落盘 + 飞书多维表格同步（v1 不实现，见 04 调研报告）---- */
const CSV_SCHEMAS={
  models:{ file:'模特信息表.csv', cols:['姓名','身高(cm)','体重(kg)','体格特征','样图','更新时间'] },
  venues:{ file:'拍摄场地表.csv', cols:['编号','场地名称','所在区','适配风格',
    '是否时效性','门票(元)','场地简述','参考图数','更新时间'] }
};
function exportCSV(which){
  /* 接口占位：v1 走「下载全量 CSV」；v2 可换 File System Access 自动追加。
     技术路径与可行性见 04-资料库同步可行性调研.md */
  const S=CSV_SCHEMAS[which];
  const rows=which==='models'
    ? MODELS.map(m=>[m.姓名,m.身高,m.体重,m.备注,m.样图?'有':'无',(m.updatedAt||'').slice(0,10)])
    : VENUES.map(v=>[v.id,v.名称,v.所在区,v.适配风格,v.时效性,v.门票,
                     v.简述,(v.图||[]).length,(v.updatedAt||'').slice(0,10)]);
  const q=c=>'"'+String(c??'').replace(/"/g,'""')+'"';
  const csv='﻿'+[S.cols.map(q).join(','),...rows.map(r=>r.map(q).join(','))].join('\r\n');
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
  a.download=S.file; a.click(); URL.revokeObjectURL(a.href);
  toast('已导出 '+S.file+'（'+rows.length+' 条记录）\n追加新记录后请重新导出并覆盖');
}

document.addEventListener('change',async e=>{
  const fi=e.target.dataset.fi; if(!fi) return;
  /* §4 场地参考图为多图槽：一次可传多张 */
  if(fi==='4.图.add'){
    const files=[...e.target.files].filter(f=>f.type.startsWith('image/'));
    if(!files.length){ e.target.value=''; return; }
    const room=10-(D.s4.图||[]).length;
    if(files.length>room) toast('最多 10 张，已保留前 '+room+' 张');
    for(const f of files.slice(0,room)){
      const {url,w,h,size}=await shrink(f);
      ASSETS['4.图.'+D.s4.图.length]={mime:'image/jpeg',w,h,size,
        uploadedAt:new Date().toISOString()};
      D.s4.图.push(url);
    }
    save(); render(); e.target.value='';
    toast('已添加场地参考图（'+D.s4.图.length+'/10）'); return;
  }
  /* v1.5 §1 模特样图：定槽上传（1-2 张），一次可多选填补空槽 */
  if(fi==='1.样图.add'){
    D.s1.样图=D.s1.样图||[];
    const files=[...e.target.files].filter(f=>f.type.startsWith('image/'));
    if(!files.length){ e.target.value=''; return; }
    let n=0;
    for(let i=0;i<2&&n<files.length;i++){
      if(await setPickArr('1.样图',D.s1.样图,null,files[n++],2)) continue;
    }
    if(n<files.length) toast('模特样图最多 2 张，多余的已忽略');
    save(); render(); e.target.value='';
    toast('已添加模特样图（'+D.s1.样图.length+'/2）'); return;
  }
  /* v1.5 数组槽定槽替换（如 1.样图.0） */
  const mArr=fi.match(/^(1\.样图)\.(\d+)$/);
  if(mArr){
    D.s1.样图=D.s1.样图||[];
    await setPickArr(mArr[1],D.s1.样图,+mArr[2],e.target.files[0],2);
    save(); render(); e.target.value=''; return;
  }
  /* v1.5 §5 道具参考图：一次可多选，追加到末尾 */
  if(fi==='5.图.add'){
    D.s5.图=D.s5.图||[];
    const files=[...e.target.files].filter(f=>f.type.startsWith('image/'));
    for(const f of files){ if(!await setPickArr('5.图',D.s5.图,null,f,8)) break; }
    save(); render(); e.target.value='';
    toast('已添加道具参考图（'+D.s5.图.length+'/8）'); return;
  }
  const m5=fi.match(/^5\.图\.(\d+)$/);
  if(m5){ D.s5.图=D.s5.图||[];
    await setPickArr('5.图',D.s5.图,+m5[1],e.target.files[0],8);
    save(); render(); e.target.value=''; return; }
  /* v1.5 §11 参考样片：一次可多选，追加到末尾，上限 25 张 */
  if(fi==='11.样片.add'){
    D.s11.样片=D.s11.样片||[];
    const files=[...e.target.files].filter(f=>f.type.startsWith('image/'));
    for(const f of files){ if(!await setPickArr('11.样片',D.s11.样片,null,f,S11_MAX)) break; }
    save(); render(); e.target.value='';
    const n=D.s11.样片.length;
    toast(n>=S11_MAX ? '已达上限 '+S11_MAX+' 张'
        : '已添加参考样片（'+n+'/'+S11_MAX+'）'+
          (n<S11_MIN?'，还差 '+(S11_MIN-n)+' 张才达建议下限':'')); return;
  }
  const m11=fi.match(/^11\.样片\.(\d+)$/);
  if(m11){ D.s11.样片=D.s11.样片||[];
    await setPickArr('11.样片',D.s11.样片,+m11[1],e.target.files[0],S11_MAX);
    save(); render(); e.target.value=''; return; }
  await setPick(fi,e.target.files[0]); e.target.value='';
});

/* 导出 */
function missing(){
  const done=doneSet();
  return reqList().filter(([s,k])=>!done.has(s+'-'+k));
}
function gate(act){
  const m=missing();
  if(!m.length) return act();
  $('#mN').textContent=m.length;
  $('#mList').innerHTML=m.map(x=>`<div>· <b>${esc(x[2])}</b></div>`).join('');
  $('#modal').classList.add('on');
  $('#mGo').onclick=()=>{ $('#modal').classList.remove('on'); act(); };
  $('#mCancel').onclick=()=>$('#modal').classList.remove('on');
}

/* 导航高亮 + 拖拽排序 */
const io=new IntersectionObserver(es=>{
  es.forEach(e=>{ if(e.isIntersecting){
    cur=e.target.id.replace('sec-','');
    document.querySelectorAll('.nav a').forEach(a=>
      a.classList.toggle('on',a.getAttribute('href')==='#sec-'+cur));
  }});
},{rootMargin:'-70px 0px -70% 0px'});
document.addEventListener('DOMContentLoaded',()=>render());
setTimeout(()=>document.querySelectorAll('.sec').forEach(s=>io.observe(s)),0);

let dragK=null,dragI=null;
document.addEventListener('dragstart',e=>{
  const tr=e.target.closest('[data-row]'); if(!tr) return;
  const[k,i]=tr.dataset.row.split('.'); dragK=k; dragI=+i; tr.classList.add('dragging');
});
document.addEventListener('dragend',e=>{
  document.querySelectorAll('tr').forEach(x=>x.classList.remove('dragging','over'));
});
document.addEventListener('dragover',e=>{
  const tr=e.target.closest('[data-row]'); if(!tr||dragK===null) return;
  if(tr.dataset.row.split('.')[0]!==dragK) return;
  e.preventDefault(); tr.classList.add('over');
});
document.addEventListener('drop',e=>{
  const tr=e.target.closest('[data-row]');
  if(!tr||dragK===null) return;
  const[k,i]=tr.dataset.row.split('.');
  if(k!==dragK||+i===dragI){ dragK=null; return; }
  const arr=(k==='配饰'?D.s2.配饰[0]:k==='灯位'?D.s65.灯位[0]:D.s2[k]);
  const [m]=arr.splice(dragI,1); arr.splice(+i,0,m);
  dragK=null; save(); render();
});

/* toast */
let tT;
function toast(msg){
  let el=document.getElementById('toast');
  if(!el){ el=document.createElement('div'); el.id='toast';
    el.style.cssText='position:fixed;bottom:26px;left:50%;transform:translateX(-50%);'
      +'background:var(--panel);border:1px solid var(--border);border-radius:10px;'
      +'padding:12px 20px;font-size:13px;box-shadow:var(--sh);z-index:9999;max-width:80vw;'
      +'white-space:pre-line;color:var(--text)';
    document.body.appendChild(el); }
  el.textContent=msg; el.style.display='block';
  clearTimeout(tT); tT=setTimeout(()=>el.style.display='none',3800);
}
